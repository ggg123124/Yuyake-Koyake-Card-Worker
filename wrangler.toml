name = "yuyake-koyake-card-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# JWT_SECRET 不再以明文 vars 提交（仓库公开，且明文会随部署暴露）。
# 生产环境:  npx wrangler secret put JWT_SECRET
# 本地开发:  写入 .dev.vars（已 gitignore）

[[d1_databases]]
binding = "DB"
database_name = "xiyao-wanyao-db"
database_id = "a26e6f25-0a5d-4a5e-8796-12605b94d39a"

[durable_objects]
bindings = [
  { name = "ROOM_DO", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[assets]
directory = "./src/public"

[ai]
binding = "AI"
# 本地 wrangler dev 下 AI binding 需标记 remote 才能实际调用（否则显示 not supported）
remote = true

[triggers]
crons = ["0 20 * * *", "*/2 * * * *"]
