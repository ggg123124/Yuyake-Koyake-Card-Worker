<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夕妖晚谣工具</title>
<style>
:root{--primary:#E67E22;--primary-light:#F39C12;--primary-dark:#D35400;--bg:#FFF8F0;--card:#fff;--text:#333;--danger:#c0392b;--success:#27ae60;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;min-height:100vh}
.view{display:none;padding:12px;max-width:1400px;margin:0 auto}
.view.active{display:block}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:12px 20px;font-size:18px;border-radius:8px;border:none;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s,transform .1s;margin:4px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#eee;color:var(--text)}
.btn-secondary:hover{background:#ddd}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#a93226}
.btn-lg{padding:16px 28px;font-size:20px}
.btn-sm{padding:8px 14px;font-size:16px}
input,select{width:100%;min-height:48px;padding:12px;font-size:18px;border:2px solid #ddd;border-radius:8px;margin:8px 0;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--primary)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;padding:14px;font-size:18px;border:none;border-radius:8px;background:#eee;cursor:pointer}
.tab-btn.active{background:var(--primary);color:#fff}
.hidden{display:none!important}
.topbar{background:var(--primary);color:#fff;padding:16px;border-radius:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topbar b{font-size:18px}
.tag{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:6px;font-size:14px}
.phase-badge{background:var(--primary-light);padding:6px 14px;border-radius:20px;font-size:16px;font-weight:700}
.accordion .panel{background:var(--card);border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.panel-title{background:var(--primary);color:#fff;padding:16px;font-size:20px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;min-height:56px}
.panel-title .chevron{transition:transform .2s}
.panel-title.collapsed .chevron{transform:rotate(-90deg)}
.panel:has(.panel-content.collapsed) .chevron{transform:rotate(-90deg)}
.panel-content{padding:16px}
.panel-content.collapsed{display:none}
#outgoing-list,#incoming-content{overflow-x:auto}
.member-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #f0f0f0;min-height:48px}
.member-row:last-child{border-bottom:none}
.badge{padding:4px 10px;border-radius:6px;font-size:14px;background:#eee}
.badge-gm{background:var(--primary-light);color:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #eee;font-size:16px}
th{background:#fafafa}
.star-btn,.star{font-size:32px;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;color:#ddd}
.star-btn.active,.star.active{color:var(--primary-light)}
.stars{display:inline-flex;gap:4px;vertical-align:middle}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:min(560px,92vw);max-height:90vh;overflow-y:auto}
.modal.modal-wide{max-width:min(860px,94vw)}
.modal h3{margin-bottom:16px;color:var(--primary);font-size:22px}
.modal-actions{display:flex;gap:12px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:8px;font-weight:700;font-size:16px}
.grid-btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.grid-btns .btn{margin:0;height:56px;font-size:18px}
.target-btn{width:100%;text-align:left;justify-content:flex-start}
.toast{position:fixed;top:20px;right:20px;padding:16px 24px;border-radius:10px;color:#fff;font-size:18px;z-index:200;animation:slideIn .3s ease;max-width:90vw;word-break:break-word}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(243,156,18,.7)}70%{box-shadow:0 0 0 12px rgba(243,156,18,0)}100%{box-shadow:0 0 0 0 rgba(243,156,18,0)}}
.flash{animation:flash 1.5s ease infinite}
.keyboard-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:12px 0}
.keyboard-grid .btn{min-width:0;padding:10px 4px;font-size:18px;margin:0;height:52px}
.keyboard-input{width:100%;text-align:center;font-size:22px;margin-bottom:12px;background:#fafafa}
.calc-result{background:#fafafa;padding:16px;border-radius:10px;margin-top:12px}
.calc-result h4{margin-bottom:8px;color:var(--primary)}
.calc-result ul{list-style:none;padding-left:0}
.calc-result li{padding:4px 0}
.empty{text-align:center;color:#999;padding:24px;font-size:18px}
#lobby-actions{display:flex;flex-direction:column;gap:12px}
#lobby-actions .btn{width:100%}
a.btn{text-decoration:none}
.room-info{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.room-col-left,.room-col-right{display:contents}
@media(min-width:1024px){.accordion{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}.room-col-left{grid-column:1;display:flex;flex-direction:column}.room-col-right{grid-column:2;display:flex;flex-direction:column}}
@media(max-width:768px){.accordion{display:block}.room-col-left,.room-col-right{display:contents}}
@media(max-width:600px){.keyboard-grid{grid-template-columns:repeat(5,1fr)}.grid-btns{grid-template-columns:repeat(2,1fr)}}
.resource-group{display:inline-flex;align-items:center;gap:4px;font-size:13px;margin:0 4px;flex-wrap:nowrap;font-variant-numeric:tabular-nums}
.res-val{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-weight:600;line-height:1.2;white-space:nowrap;min-width:40px;justify-content:center}
.res-dream{color:#9b59b6}
.res-feeling{color:#e74c3c}
.res-wonder{color:#3498db}
.res-editable{cursor:pointer;border-bottom:1px dashed #999;transition:background .15s}
.res-editable:hover{background:#f0e6ff}
.res-input{width:50px;min-height:24px;padding:2px 4px;font-size:13px;border:2px solid var(--primary);border-radius:4px;margin:0 2px;text-align:center}
.btn-give-dream{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;font-size:12px;line-height:1.2;border:1px solid #9b59b6;border-radius:4px;background:#f5eef8;color:#9b59b6;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-give-dream:hover{background:#e8d5f0}
.btn:disabled,.btn[disabled]{background:#ccc!important;color:#999!important;cursor:not-allowed!important;transform:none!important}
.btn:disabled:active,.btn[disabled]:active{transform:none!important}
.calc-hint{font-size:13px;color:#999;margin-top:4px}
.bond-editable{cursor:pointer;text-decoration:underline dotted;transition:color .15s}
.bond-editable:hover{color:var(--primary)}
.topbar-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:4px 12px;border-radius:6px;font-size:14px;cursor:pointer;transition:background .2s;min-height:auto;min-width:auto;display:inline-flex;align-items:center;gap:4px;line-height:1.5}
.topbar-btn:hover{background:rgba(255,255,255,.35)}
.topbar-btn:active{transform:scale(.96)}
.topbar-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.drag-handle{cursor:grab;user-select:none;color:#bbb;font-size:20px;padding:0 6px;touch-action:none}
.drag-handle:hover{color:var(--primary)}
.drag-handle:active{cursor:grabbing}
.skill-btn{padding:4px 10px;font-size:13px;border-radius:6px;border:1px solid #9b59b6;background:#f5eef8;color:#6c3483;cursor:pointer;transition:background .15s,box-shadow .15s;white-space:nowrap;line-height:1.4;min-height:auto;min-width:auto;display:inline-flex;align-items:center;gap:3px}
.skill-btn:hover{background:#e8d5f0}
.skill-btn.active{background:#9b59b6;color:#fff;box-shadow:0 0 0 2px rgba(155,89,182,.4)}
.reason-preset{padding:4px 10px;font-size:13px;border-radius:6px;border:1px solid var(--primary);background:#fff3e0;color:var(--primary-dark);cursor:pointer;transition:background .15s,box-shadow .15s;white-space:nowrap;line-height:1.4;min-height:auto;min-width:auto;display:inline-flex;align-items:center}
.reason-preset:hover{background:#ffe0b2}
.reason-preset.active{background:var(--primary);color:#fff;box-shadow:0 0 0 2px rgba(230,126,34,.4)}
.reason-section{margin-bottom:12px}
.reason-section>label{display:block;margin-bottom:6px;font-weight:600;font-size:14px;color:#666}
tr.dragging{opacity:.4;background:#fff3e0}
tr.drag-over-top{box-shadow:0 -3px 0 0 var(--primary) inset}
tr.drag-over-bottom{box-shadow:0 3px 0 0 var(--primary) inset}
#view-loading{align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;padding:0;max-width:none;margin:0}
#view-loading.active{display:flex}
.loading-spinner{width:48px;height:48px;border:4px solid #f0d9bc;border-top:4px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--primary);font-size:20px;font-weight:600}
</style>
</head>
<body>

<div id="view-loading" class="view active">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载中...</div>
</div>

<div id="view-login" class="view">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:20px;color:var(--primary)">夕妖晚谣工具</h2>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">登录</button>
      <button class="tab-btn" onclick="switchTab('register')">注册</button>
    </div>
    <div id="login-panel">
      <input id="login-user" placeholder="用户名" autocomplete="username">
      <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn btn-primary btn-lg" style="width:100%" onclick="doLogin()">登录</button>
    </div>
    <div id="register-panel" class="hidden">
      <input id="reg-user" placeholder="用户名" autocomplete="username">
      <input id="reg-pass" type="password" placeholder="密码" autocomplete="new-password">
      <input id="reg-name" placeholder="显示昵称">
      <button class="btn btn-primary btn-lg" style="width:100%" onclick="doRegister()">注册</button>
    </div>
  </div>
</div>

<div id="view-lobby" class="view">
  <div class="topbar" style="justify-content:space-between">
    <div><b>房间大厅</b></div>
    <div id="lobby-user"></div>
  </div>
  <div class="card" id="lobby-actions">
    <button class="btn btn-primary btn-lg" onclick="showCreateRoom()">创建房间</button>
    <button class="btn btn-primary btn-lg" onclick="showJoinRoom()">加入房间</button>
    <a href="/character-editor.html" class="btn btn-secondary btn-lg" style="text-align:center">角色卡编辑</a>
    <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
  </div>
</div>

<div id="view-room" class="view">
  <div class="topbar">
    <div class="room-info">
      <b id="room-title"></b>
      <span id="room-code" class="tag"></span>
      <span id="room-phase" class="phase-badge"></span>
      <button class="topbar-btn" onclick="copyRoomLink()" id="btn-copy-link" title="复制房间链接">复制链接</button>
      <button class="topbar-btn" onclick="refreshAllData()" id="btn-refresh" title="刷新所有数据">🔄 刷新</button>
      <button class="btn btn-danger btn-sm hidden" onclick="leaveRoom()" id="btn-gm-leave">离开房间</button>
    </div>
    <div class="room-info" id="my-char-info">
      <span>我: <b id="my-char-name"></b></span>
      <span>梦点: <b id="my-dream"></b></span>
      <span>心意点: <b id="my-feeling"></b></span>
      <span>奇迹点: <b id="my-wonder"></b></span>
      <button class="btn btn-danger btn-sm" onclick="leaveRoom()">离开房间</button>
    </div>
  </div>
  <div class="accordion">
    <div class="room-col-left">
      <div class="panel">
        <div class="panel-title collapsed" onclick="toggleAccordion('members-content')">成员列表 <span class="chevron">▼</span></div>
        <div id="members-content" class="panel-content collapsed"></div>
      </div>
      <div class="panel" id="panel-outgoing">
        <div class="panel-title" onclick="toggleAccordion('outgoing-content')">我对他人的牵绊 <span class="chevron">▼</span></div>
        <div id="outgoing-content" class="panel-content">
          <button class="btn btn-primary" onclick="openBondModal()">添加牵绊</button>
          <div id="outgoing-list" style="margin-top:12px"></div>
        </div>
      </div>
      <div class="panel" id="panel-incoming">
        <div class="panel-title collapsed" onclick="toggleAccordion('incoming-content')">他人对我的牵绊 <span class="chevron">▼</span></div>
        <div id="incoming-content" class="panel-content collapsed">
          <button class="btn btn-primary" onclick="openIncomingBondModal()">添加牵绊</button>
          <div id="incoming-list" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
    <div class="room-col-right">
      <div class="panel" id="panel-calc">
        <div class="panel-title collapsed" onclick="toggleAccordion('calc-content')">心意点/奇迹点结算 <span class="chevron">▼</span></div>
        <div id="calc-content" class="panel-content collapsed">
          <button class="btn btn-primary btn-lg" style="width:100%" id="btn-calculate" onclick="doCalculate()">结算</button>
          <div id="calc-hint" class="calc-hint"></div>
          <div id="calc-result"></div>
        </div>
      </div>
      <div class="panel" id="panel-player-deduct">
        <div class="panel-title collapsed" onclick="toggleAccordion('player-deduct-content')">点数调整 <span class="chevron">▼</span></div>
        <div id="player-deduct-content" class="panel-content collapsed">
          <div class="form-group"><label>调整模式</label><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-sm btn-danger" id="player-mode-deduct" onclick="setPlayerDeductMode('deduct')" style="flex:1">消耗</button><button class="btn btn-sm btn-secondary" id="player-mode-add" onclick="setPlayerDeductMode('add')" style="flex:1">增加</button></div></div>
          <div class="reason-section" id="player-reason-section"><label>消耗原因</label><div id="player-reason-presets" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><button class="reason-preset" onclick="setPlayerReason('变化形态')">变化形态</button></div><div id="player-skill-buttons" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"></div><input id="player-reason-input" placeholder="输入消耗原因（可选）" style="font-size:14px;min-height:36px;padding:6px 10px;margin:0"></div>
          <div class="form-group"><label id="player-wonder-label">消耗奇迹点</label><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="btn btn-sm" onclick="adjustPlayerDeductWonder(-1)">-</button><b id="player-deduct-wonder-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustPlayerDeductWonder(1)">+</button><button class="btn btn-danger" id="player-wonder-btn" onclick="doPlayerDeductWonder()">确认消耗</button></div></div>
          <div class="form-group"><label id="player-feeling-label">消耗心意点</label><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="btn btn-sm" onclick="adjustPlayerDeductFeeling(-1)">-</button><b id="player-deduct-feeling-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustPlayerDeductFeeling(1)">+</button><button class="btn btn-danger" id="player-feeling-btn" onclick="doPlayerDeductFeeling()">确认消耗</button></div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title collapsed" onclick="toggleAccordion('resource-logs-content');if(!document.getElementById('resource-logs-content').classList.contains('collapsed'))loadResourceLogs()">资源变更日志 <span class="chevron">▼</span></div>
        <div id="resource-logs-content" class="panel-content collapsed">
          <div id="resource-logs-filter" style="margin-bottom:10px">
            <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:#666;margin-right:2px">类型:</span><button class="btn btn-sm btn-primary" data-filter-type="type" data-filter="all" onclick="filterResourceLogs('type','all')">全部</button><button class="btn btn-sm" data-filter-type="type" data-filter="dream" onclick="filterResourceLogs('type','dream')">梦点</button><button class="btn btn-sm" data-filter-type="type" data-filter="wonder" onclick="filterResourceLogs('type','wonder')">奇迹点</button><button class="btn btn-sm" data-filter-type="type" data-filter="feeling" onclick="filterResourceLogs('type','feeling')">心意点</button></div>
            <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:#666;margin-right:2px">收支:</span><button class="btn btn-sm btn-primary" data-filter-type="flow" data-filter="all" onclick="filterResourceLogs('flow','all')">全部</button><button class="btn btn-sm" data-filter-type="flow" data-filter="income" onclick="filterResourceLogs('flow','income')">收入</button><button class="btn btn-sm" data-filter-type="flow" data-filter="expense" onclick="filterResourceLogs('flow','expense')">支出</button></div>
            <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:#666;margin-right:2px">玩家:</span><select id="resource-logs-player" onchange="filterResourceLogs('player',this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:13px"><option value="all">全部玩家</option></select></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span style="font-size:13px;color:#666;margin-right:2px">时间:</span><select id="resource-logs-time" onchange="filterResourceLogs('time',this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:13px"><option value="all">全部时间</option><option value="today">今天</option><option value="7d">最近7天</option><option value="30d">最近30天</option></select></div>
          </div>
          <div id="resource-logs-list">加载中...</div>
        </div>
      </div>
      <div class="panel hidden" id="panel-gm">
        <div class="panel-title collapsed" onclick="toggleAccordion('gm-content')">GM 面板 <span class="chevron">▼</span></div>
        <div id="gm-content" class="panel-content collapsed">
          <div class="form-group"><label>发放梦点</label><div id="gm-dream-targets"></div><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="btn btn-sm" onclick="adjustDream(-1)">-</button><b id="dream-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustDream(1)">+</button><button class="btn btn-primary" onclick="doGiveDream()">确认发放</button></div></div>
          <div class="form-group"><label>场景阶段</label><div class="grid-btns"><button class="btn btn-secondary" onclick="doSetPhase('scene')">场景中</button><button class="btn btn-secondary" onclick="doSetPhase('intermission')">幕间</button><button class="btn btn-secondary" onclick="doSetPhase('ending')">故事结束</button></div></div>
          <div class="form-group"><label>调整模式</label><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-sm btn-danger" id="gm-mode-deduct" onclick="setGMPointMode('deduct')" style="flex:1">扣除</button><button class="btn btn-sm btn-secondary" id="gm-mode-add" onclick="setGMPointMode('add')" style="flex:1">增加</button></div></div>
          <div class="reason-section"><label>操作原因</label><input id="gm-reason-input" placeholder="输入操作原因（可选）" style="font-size:14px;min-height:36px;padding:6px 10px;margin:0"></div>
          <div class="form-group"><label id="gm-wonder-label">扣除奇迹点</label><div id="gm-wonder-targets"></div><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="btn btn-sm" onclick="adjustDeductWonder(-1)">-</button><b id="deduct-wonder-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustDeductWonder(1)">+</button><button class="btn btn-danger" id="gm-wonder-btn" onclick="doDeductWonder()">确认扣除</button></div></div>
          <div class="form-group"><label id="gm-feeling-label">扣除心意点</label><div id="gm-feeling-targets"></div><div style="display:flex;align-items:center;gap:12px;margin-top:12px"><button class="btn btn-sm" onclick="adjustDeductFeeling(-1)">-</button><b id="deduct-feeling-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustDeductFeeling(1)">+</button><button class="btn btn-danger" id="gm-feeling-btn" onclick="doDeductFeeling()">确认扣除</button></div></div>
          <div class="form-group"><label>调整角色</label><div id="gm-role-list"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LEVEL_COST={1:5,2:5,3:5,4:8,5:12};
const PHASE_MAP={scene:'场景中',intermission:'幕间',ending:'故事结束'};
const BOND_TYPES=[{n:'好感',c:'#FF85A2'},{n:'愛情',c:'#E74C3C'},{n:'保护',c:'#3498DB'},{n:'信任',c:'#2ECC71'},{n:'家族',c:'#A0522D'},{n:'憧憬',c:'#9B59B6'},{n:'競争',c:'#E67E22'},{n:'尊敬',c:'#F1C40F'},{n:'戀慕',c:'#C0392B'},{n:'收容',c:'#1ABC9C'}];
const KEY_ROWS=[['1','2','3','4','5','6','7','8','9','0'],['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M']];
const WEAKNESS_ABILITY_DATA={'狐':[{weakness:'油炸豆腐',weaknessDesc:'狐最喜欢吃的就是油炸豆腐。看到油炸豆腐的时候，狐的变身会稍微解除一些。也就是说，如果是完全人类的状态的话，尾巴会露出来。如果是露出尾巴的状态的话，耳朵会露出来。如果是耳朵和尾巴都露出来的状态的话，就会完全变回动物的姿态。',ability:'吹牛大王',abilityCost:8,abilityDesc:'可以让对方相信自己说出来的任何谎话。通过比较对方的【涉世】属性和狐的【变化】属性，如果狐的【变化】属性较高的话，对方就会被骗过。只要不是证据摆在眼前的谎话，对方都会不加以怀疑地相信。'},{weakness:'鬼鬼祟祟',weaknessDesc:'狐不能让别人看到自己的真身。要是完全的狐狸状态被人看到的话，在这次故事结束之前，你和小镇还有被看到的人的【牵绊】减少1个等级。',ability:'旧识新交',abilityCost:6,abilityDesc:'因为相当的长寿，狐拥有许多古老的知识与缘分。当你遇到别的化形时，你可以将他们设定为你已经认识的朋友。当你遇到人类的时候，你也可以声明你在他小时候就见过他。通过【相遇】获得的【牵绊】可以提高1个等级。（适用于土地神）这个【特技】只能在第一次见到对方时使用。另外，使用的时候，必须要告诉讲述者你是如何和对方认识的。'},{weakness:'装腔作势',weaknessDesc:'狐总是不经意间对别的化形和人类保持一种高傲的态度。如果有人想强化和拥有这个【弱点】的狐的【牵绊】，需要支付额外2点【梦】点数。',ability:'狐之神社',abilityCost:0,abilityDesc:'获得一个有人类祭祀的【神社】。拥有神社的狐，在故事结束前可以拥有1万日元的【真钱】。另外，就算被人类看到了自己的狐姿态，也不会被追赶或者捉弄（但是会被【吓一跳】）此外，也可以和土地神们进行平等的对话。'},{weakness:'奇行异举',weaknessDesc:'狐的穿着打扮和言行总是和这个时代格格不入，或者总是追求华丽到惹人注目的外表。因为太过于招人显眼，你没有办法隐藏自己，在小镇里走动时就算是人类的姿态，依然会成为众人的关注点。',ability:'飘飘悠悠',abilityCost:4,abilityDesc:'你可以悠闲地漂浮在半空中。虽然移动时和人类步行的速度差不多，但你可以飞到高高的地方，在找东西的时候也可以增加1点能力值。效果持续到[场景]结束。'},{weakness:'冷眉冷眼',weaknessDesc:'狐不善于表现自己的感情，经常因为冷淡的言行而惹人注目。对方通过【相遇】获得的关于狐的【牵绊】等级-1。',ability:'广结良缘',abilityCost:4,abilityDesc:'通过训斥对方或者采取冷漠的态度，你可以得到和别的【场景】中的登场人物的缘分。通过减少某个角色和狐之间的【牵绊】的1个等级，你可以增加别的场景中的一个角色和狐之间的【牵绊】的1个等级。这个增加的等级可以是从0到1的。'},{weakness:'逞强好胜',weaknessDesc:'狐总是会说自己能做到超出自己能力范围的事情。每次你想在判定时使用【心意点】点数的时候，你必须额外支付2点。',ability:'狐之领礼',abilityCost:8,abilityDesc:'你可以将带有特殊力量的道具送给人类。你可以从自身或者同伴的【特技】当中选择一个，然后将其送给人类。如果使用得当，人类也可以使用这【特技】。'}],'狸':[{weakness:'惴惴不安',weaknessDesc:'狸非常胆小，很容易就会被吓到。如果需要进行【吓一跳】的判定的话，和判定结果无关你都会失去意识。虽然就算失去意识你的变身也不会解除，但是如果不借助伙伴的帮助的话你将什么都做不到。',ability:'庞然大物',abilityCost:8,abilityDesc:'通过将身体变得很大来让看到的人【吓一跳】。第一次看到狸的这个特技的所有角色（包括化形）都会被【吓一跳】。在这个【吓一跳】判定中，狸的【变化】属性额外提高2点。'},{weakness:'忠厚老实',weaknessDesc:'狸就算自己会去骗别人，也没有想过自己也会被别人欺骗。就算别人在对你说谎，你也不会去怀疑他们。即使你很清楚别的角色在说谎，你所扮演的狸分身也必须要去相信他们所说的话。',ability:'冒冒失失',abilityCost:6,abilityDesc:'你可以通过展示自己的冒失之处来缓和周围的氛围。只有当狸做了冒失的事情并因此得到【梦】点数的时候才可以使用。所有看到这个冒失场面的角色（讲述者的NPC角色最多3人）获得2点【梦】点数。'},{weakness:'饕餮之徒',weaknessDesc:'狸钟情于各种美食。如果没吃饱的话，就没法好好地行动。另外，如果眼前有食物的话，就算有别的要做的事情，也会先把食物吃完再去考虑。',ability:'饥肠辘辘',abilityCost:8,abilityDesc:'你可以用肚子饿了的声音来缓和周围的氛围。在没有吃任何东西的[场景]之后的一个场景中，你可以提出自己肚子饿了，然后使用这个【特技】。对于狸拥有【保护】、【爱情】或者【家族】的【牵绊】的角色可以将【牵绊】等级提高1级。但是，最高只能提高到4级。'},{weakness:'得意忘形',weaknessDesc:'狸只要一被夸奖，就会马上得意忘形。遇到困难的判定的时候，就算你知道你会失败（例如是那种不需要你去判定的时候）你也会进行判定。',ability:'狸之舞蹈',abilityCost:12,abilityDesc:'你可以用奇怪的舞蹈让观众感到高兴。只要看到的人的【涉世】属性不大于4，他们都会停下正在做的事情并捧腹大笑。所有笑出来的人全部都可以得到3点【梦】点数。'},{weakness:'悠然自得',weaknessDesc:'狸做什么都很慢。你的化形的【野性】属性不能高于1，并且当你遇到【野性】的判定的时候，如果你想使用【心意点】来提高【野性】属性，你需要额外花费1点【心意点】。',ability:'小憩片刻',abilityCost:4,abilityDesc:'你可以通过放松身心来强化变身能力。在没有登场的[场景]结束的时候，你可以获得6点【奇迹点】。'},{weakness:'顽童天性',weaknessDesc:'狸天生喜欢捉弄别人。在小镇上发生的不可思议的事件，都会被当做是狸做的。因此，无法拥有3级以上的和「小镇」的【牵绊】。',ability:'古怪精灵',abilityCost:0,abilityDesc:'因为喜欢恶作剧，你就算做了恶作剧大家也会依然喜欢着你。当你吓到某个人的时候，你可以得到除了你以外的参加人数（包括讲述者）的【梦】点数，以及大家对你的恶作剧的评价。'}],'猫':[{weakness:'好动天性',weaknessDesc:'猫的好奇心和狩猎本能非常强烈。当看到比自己小又会动的东西，或者自己没有见过的东西，会不由自主地靠近它或者追赶它。另外，如果它表现出某种意图或者突然做出反应的话，你也会被【吓一跳】。（用【童真】属性进行判定，具体的值由讲述者决定）',ability:'顺手牵羊',abilityCost:8,abilityDesc:'可以在不被对方发现的情况下偷走对方的所有物。如果是视线内的角色身上的东西的话，不管是什么都可以偷走一个（最多一个）。虽然连身上穿着的衣服都可以偷走，但是不能偷走类似于代步工具之类猫本身没有的东西。'},{weakness:'游手好闲',weaknessDesc:'猫在炎热的天气或者寒冷的天气里总是非常懒散。当你需要为身体活动进行判定、或者使用【特技】的时候，你必须支付一点【心意点】才可以做到。',ability:'酣然入梦',abilityCost:0,abilityDesc:'就算你什么事情都没做，你依然可以有活跃的表现。在一个[场景]中，如果你登场的时候一直处于睡觉或者犯困的状态的话，你在[场景]结束时可以获得10点【梦】点数。但是，如果你在[场景]中进行过判定，使用过特技，或者积极地发言过的话，这个效果就无法发动。（能否发动由讲述者决定）'},{weakness:'敏感舌头',weaknessDesc:'猫的舌头很敏感，因此没法吃很多东西，例如特别烫的东西，柑橘，乌贼，生的洋葱。如果，一不小心吃下去了这些东西的话，必须自动进行必要值为7的【吓一跳】的判定。',ability:'暗瞒',abilityCost:4,abilityDesc:'你可以隐藏自己的本性，巧妙地进行角色扮演。这个【特技】在进行判定前由你声明发动。使用了之后，你可以选择你想用于判定的属性值，而不是规则或者讲述人指定的属性值。'},{weakness:'遇水则慨',weaknessDesc:'猫既不会游泳，也很讨厌水。如果进到澡堂或者泳池这种有大量水的地方的话，你必须自动进行必要值为7的【吓一跳】的判定。',ability:'杂技演员',abilityCost:4,abilityDesc:'你可以完成一些就像是飞起来一样的动作。和运动能力相关的【野性】判定中，不管该动作有多么的不可能，你依然能够成功完成（但是，游泳是做不到的）。'},{weakness:'随心所欲',weaknessDesc:'猫的独立性很强，不怎么会去听别人所说的话。就算你和别人的【牵绊】都到达了5级，也无法获得【强力牵绊】的额外奖励（后面会介绍）。',ability:'暗中观察',abilityCost:6,abilityDesc:'这意味着你其实一直在暗地里观察着一切的发生与变化。如果使用了这个【特技】的话，你可以看到你没有登场的[场景]以及故事发生之前的事情。但是，猫无法看到自身出生之前所发生的事情。'},{weakness:'张牙舞爪',weaknessDesc:'猫一看到纸质的拉门或者隔扇的时候，就会忍不住伸出爪子去挠它。要是在小镇上看到了这样的东西的话，你就会忘记自己正在做的事情，而专心投入到用爪子去抓挠那个诱人的东西上。',ability:'咄咄逼人',abilityCost:8,abilityDesc:'通过展示自己神秘的威严来对某人进行威吓，并试图将其吓跑。如果你的【变化】属性高于对方的【涉世】属性的话，就可以立刻让对方从此[场景]中退场。但是，此【特技】无法对友方的化形使用。'}],'犬':[{weakness:'颈上项圈',weaknessDesc:'狗拥有特定的主人，因此无法违抗他的命令。和【牵绊】的强度无关，你无法做出违逆【主人】的行动。',ability:'有家可归',abilityCost:0,abilityDesc:'在故事开始时，和【主人】获得等级2的【牵绊】。这个牵绊只能在主人实际登场的[场景]中强化。主人具体是怎样的角色由讲述者可以选择无视你的请求。'},{weakness:'笨手笨脚',weaknessDesc:'狗不善于做一些精细的工作，或者照顾好自己。你的【涉世】属性必须为0点，并且在进行【涉世】属性判定时，如果你想使用【心意点】点数，必须要付出额外的1点。',ability:'咬紧牙关',abilityCost:4,abilityDesc:'你拥有着无论怎样的情况都可以咬牙忍受下来的坚韧意志。如果你使用此【特技】，你可以在自己被【吓一跳】的时候，无视它的效果（但是你必须声明你正在忍耐着）。另外，需要忍耐【弱点】的时候，也可以使用此【特技】忍耐。'},{weakness:'刚正不阿',weaknessDesc:'狗天性正直，不会说谎。在故事中，你不能说任何的谎话，即使是为了安慰别人而编织的善意的谎言。',ability:'低头认错',abilityCost:8,abilityDesc:'因为你总是个好孩子，所以大部分时候只要肯低头认错就能得到原谅。如果使用此【特技】，只要不是致命的弱端，几乎所有的争执和失败都可以通过语言和态度来得到原谅。（但是，也请好好地做出相应的态度和表现吧）'},{weakness:'天性害羞',weaknessDesc:'狗面对初次见面的人时，总是感觉不自在，十分害羞。当你通过【相遇】获得和别的角色的【牵绊】时，你对于他的【牵绊】等级-1。但是，这个效果只会对初次见面的角色发动。如果你和对方有【缘分】的话，就会正常地获得【牵绊】等级。',ability:'坚信不疑',abilityCost:6,abilityDesc:'因为你会毫不动摇自己的想法，一直相信自己和重视的朋友们。只能在[场景]结束时使用。所有你拥有【牵绊】的对象可以获得与他们和你的【牵绊】等级相等的【心意点】。'},{weakness:'纯白无垢',weaknessDesc:'狗不会去怀疑别人，不会去讨厌别人，拥有一颗纯洁无瑕的心灵。在故事中，你无法去怀疑或者讨厌别人（可以适度进行一些类似的行为，但是不会真正打心底地想去那么做）',ability:'喜欢大家',abilityCost:0,abilityDesc:'你可以真心地说出喜欢这世上的一切。和普通的【牵绊】不同，从故事的最开始你拥有等级为3的名为【对大家的爱】的【牵绊】。这个【牵绊】和普通的【牵绊】不同，只能在最后的【幕间】提升等级。如果讲述者认可的话，大家在游戏开始的时候也可以得到你的【牵绊】。'},{weakness:'凶神恶煞',weaknessDesc:'你是一条体型巨大，叫声骇人的恶犬。当别人通过【相遇】获得和你的【牵绊】时，他对你的【牵绊】等级-1。但是，这个【弱点】不适用于和你有【缘分】的角色。',ability:'盛气凌人',abilityCost:8,abilityDesc:'为了使对方害怕，你会放声大叫，并一直追赶他。如果你的【野性】属性比对方的【野性】属性高的话，你可以强制让对方从[场景]中退出。但是，此【特技】不能对作为同伴的化形使用。'}],'兔':[{weakness:'寂寞难耐',weaknessDesc:'兔子很容易感到寂寞，讨厌一个人呆着。因此你无法单独或者和别人分头行动。必须要时常和别人待在一起才行。',ability:'人见人爱',abilityCost:0,abilityDesc:'你很容易亲近别人，很容易受到别人的喜爱。在【幕间】，当你要强化自己和别人的【牵绊】时，你可以少花费1点【梦】。'},{weakness:'哭哭啼啼',weaknessDesc:'兔子总是马上会哭出来。因为很容易被【吓一跳】，被吓到的时候进行判定时能力值-2。然后，真的被【吓一跳】的时候，你会尽你所能地放声大哭出来。就算你是人类的姿态也是一样。',ability:'苦苦相求',abilityCost:6,abilityDesc:'你可以眼里含着泪水恳求别人答应你的请求，而且还可以让他们同意。如果对方的【涉世】属性比你的【童真】属性高，他可以拒绝你。但是，如果你的请求是自我毁灭类型的，（例如让别人去死）那么讲述者可以选择无视你的请求。'},{weakness:'爱如潮水',weaknessDesc:'兔子容易陷入各种恋情。故事中，当你和异性（如果讲述者同意，也可以是同性）【相遇】时，和【牵绊】的等级无关，你会获得「恋爱」的【牵绊】。在这之后，除非对方明确说明不希望和你待在一起，或者是为了不和你恋情更深的对象分开的话，你必须和你最初的恋爱对象一起行动。',ability:'最喜欢了',abilityCost:14,abilityDesc:'通过向自己喜欢的人展示自己的爱意来吸引对方，让对方对于自己的爱意变得更加强烈。可以让对方对于你的【牵绊】等级+1。这个【特技】在一个故事中对同一名角色只能使用一次。'},{weakness:'轻浮好动',weaknessDesc:'兔子不管做什么事情都慌慌张张的，十分性急。因为总是很慌张，你总会做一些多余的事情。每当你想使用【特技】时，你必须额外支付1点【奇迹点】。',ability:'足下生风',abilityCost:8,abilityDesc:'逃跑的时候，你比谁都快。在即将进行各种判定的时候可以使用，你可以从哪个[场景]离开并移动到一个安全的地方。如果对方不抵抗的话，你也可以带着一个其他角色一起退场。'},{weakness:'感同身受',weaknessDesc:'兔子总是很喜欢去考虑别人的事情。因为经常考虑别人的问题，你总会不自觉地将自己代入别人的角色里。当【场景】中有角色A拥有和你的【牵绊】最强的角色B的【牵绊】时，你对于B的【牵绊】内容会自动变成A对于B的【牵绊】内容。当有很多人和B有【牵绊】时，你可以从他们当中选择一个作为A。',ability:'共同回忆',abilityCost:6,abilityDesc:'你可以让相遇的人回想起过去共同的回忆。当别人通过【相遇】获得和你的【牵绊】时，你可以让此【牵绊】等级+1。'},{weakness:'爱撒娇鬼',weaknessDesc:'兔子比起自己动手，总喜欢依靠别人。拥有这个【弱点】的PC，只有在除他以外的所有人都判定失败时，才可以进行判定。也就是说，只要同伴里有谁通过了判定，你就不会主动地去参与判定。',ability:'一起玩吧',abilityCost:8,abilityDesc:'和别人一起游戏度过时间。在没有登场的[场景]中，你可以和那些同样没有登场的角色们玩耍度过。在使用这个【特技】的[场景]结束时，你和一起玩的伙伴们即使没有登场，依然可以用【梦】来强化你们之间的【牵绊】，也能得到【奇迹点】和【心意点】。'}],'鸟':[{weakness:'鸟眼昏花',weaknessDesc:'鸟在晚上或者昏暗的地方几乎什么也看不清。在夜间，你无法进行任何和【野性】相关的判定。',ability:'千里鹰眼',abilityCost:10,abilityDesc:'你的目光可以看到很远的地方。使用这个【特技】后，你可以在讲述者认可的范围内找到想找的人物或者东西（但是能不能拿得到是另一回事）'},{weakness:'眼球恐惧',weaknessDesc:'鸟不擅长应付眼球一样的东西。看到巨大的眼球一样的东西（例如颜色相差很大的重叠的圆形物体）时，自动进行一次必要值为7的【吓一跳】判定。当然，你也无法主动接近那样的东西。',ability:'呼朋引伴',abilityCost:14,abilityDesc:'你可以召集大量的鸟儿来帮助你。使用此【特技】的鸟在[场景]结束前【变化】和【野性】属性变成原来的2倍。但是，因为聚集了大量的鸟，你无法使用【一只小鸟】特技。如果不能好好藏起来的话，遇到你们的人将会被【吓一跳】。'},{weakness:'稀里糊涂',weaknessDesc:'鸟总是很快就会忘记各种事情。你不能进行任何和【知识】相关的【涉世】和【变化】判定。就算你自己还记得，鸟已经忘记了。',ability:'顺其自然',abilityCost:4,abilityDesc:'你相信着自己的幸运行动着，而且你还能获得成功。当你使用时，你可以获得3点【心意点】。'},{weakness:'纤弱无力',weaknessDesc:'鸟不擅长在地面上运动。不管是动物的姿态还是人类的姿态，只要你没有在用翅膀在空中飞行的时候，就无法进行和运动相关（主要是【野性】的判定）',ability:'安之若素',abilityCost:6,abilityDesc:'你可以通过拥抱别人，来让因为判定失败而陷入消沉或者因为【吓一跳】而失去意识的人从那种负面状态中恢复过来。'},{weakness:'口无遮拦',weaknessDesc:'鸟总是会把知道的事情立刻告诉别人。在故事结束的时候，所有和你有【牵绊】的角色（除了小镇）都会知道你所知道的事情。',ability:'听我道来',abilityCost:4,abilityDesc:'你可以将自己想到的事情和看到的事情告诉身处远方的同伴。使用这个【特技】的话，即使你的同伴没有在[场景]中登场，他们依然能够像就像登场了一样获得你得到的信息。另外，你也可以可以用这个【特技】来让别的[场景]中的任务振奋起来。'},{weakness:'避世绝俗',weaknessDesc:'鸟总是带着要远离人世，避开人类的想法。当你想要增强和别人的【牵绊】时，你需要支付1点额外的【梦】点数。',ability:'夕阳西下',abilityCost:20,abilityDesc:'将当前的时间立即更改为黄昏。这个效果可以无视讲述者之前设置的时间。在[场景]结束之前，时间都会变为黄昏。所有化形使用【特技】时消耗的【奇迹点】变成平时的一半。'}],'鼠':[{weakness:'忙于奔波',weaknessDesc:'鼠总是很慌张，又十分心急。因为你总是处于这种状态，你会做很多无用功。当你要使用【特技】时，你必须额外支付1点【奇迹点】。',ability:'溜之大吉',abilityCost:8,abilityDesc:'你可以飞快地从各种地方脱身。在即将进行各种判定的时候可以使用，你可以从那个[场景]离开并移动到一个安全的地方。如果对方不抵抗的话，你也可以带着一个其他角色一起退场。'},{weakness:'地底居民',weaknessDesc:'鼠长期住在幽暗的地下洞穴里。因此，他不太了解地面上的事物或者小镇里的情况。对小镇相关的信息，地形相关的知识，以及机械相关的知识的判定会自动失败。',ability:'秘藏之宝',abilityCost:6,abilityDesc:'你知道那些被忘却的宝藏的位置。拥有这个【特技】的鼠，在故事结束之前拥有价值50万日元的宝物（古币或者古董品之类的）但是，因为这不是现金，所以想要按照它的价值去使用它的话还是需要花费一番功夫的。'},{weakness:'体型娇小',weaknessDesc:'鼠的个头很小，没有什么力气。你的【野性】属性不能超过2，需要进行力气相关的判定时，即使使用【心意点】也无法成功。',ability:'居家良鼠',abilityCost:0,abilityDesc:'你是那种漂亮的小白鼠，或者可爱的仓鼠。即使以动物的姿态被人类看见，也不会使对方[吓一跳]或者被当做可疑的动物。'},{weakness:'饕餮之徒',weaknessDesc:'鼠是个贪吃鬼。如果没吃饱的话，就没法好好地行动。另外，如果眼前有食物的话，就算有别的要做的事情，也会先把食物吃完再去考虑。',ability:'偷吃行家',abilityCost:4,abilityDesc:'你可以在别人没有注意到的时候偷走食物。可以偷走视线内放在对方身边的1个食物。虽然大小不限，但是像婚礼蛋糕或者火锅这种鼠拿不了的食物是不行的。'},{weakness:'抱头鼠窜',weaknessDesc:'鼠有着无法对付的动物。和是否是化形无关，当[场景]中出现没有【牵绊】的猫或者蛇的时候，你必须立即从该[场景]中退场。',ability:'目不转睛',abilityCost:6,abilityDesc:'如果对方是化形或者妖怪的话，你可以看出它的真身，并了解他的【弱点】。但是这个特技对土地神不适用。'},{weakness:'紧咬不放',weaknessDesc:'就算面对比自己更强的对手，鼠不会示弱，还会经常说出自己能做到超过自己能力的事情。在进行判定时，如果想要使用【心意点】，每次需要多支付2点。',ability:'不理你了！',abilityCost:0,abilityDesc:'就算对对方抱有好意，鼠也没有什么自觉。在[幕间]，你可以支付所需的【梦】来强化别人对你的【牵绊】（但你对他们的【牵绊】等级必须保持不变）就算对方也强化了对你的【牵绊】依然可以使用。在使用了此特技的下一个[幕间]，你可以没有限制地提高你对对方的【牵绊】等级。'}]};
const ABILITIES_DETAIL_DATA={'狐':[{name:'小恶魔气',cost:0,description:'拥有可以魅惑异性的不可思议的魅力。狐在遇到异性的人类和化形（别的动物除外）时，[相遇]带给狐的【牵绊】会强化1个等级。另外，你可以决定对方和你的【牵绊】的具体内容。'},{name:'梦中启示',cost:6,description:'让处于同一个[场景]的一名角色做一个你指定的梦，并让他们认为这是他们自己想要做的梦。如果你的【变化】属性比他们的【涉世】属性要高的话，你可以让他们做一些原本不想去做的事情，或者让他们不去做一些原本想做的事情。但是，如果你想使用这个【特技】，你必须要告诉讲述者这个梦的内容。如果讲述者认为你所说的内容有问题或者会带来矛盾的话，他可能会选择无视你的梦的效果。'},{name:'盘桓幽火',cost:6,description:'通过在尾巴的末端制造出像在燃烧一样的效果，给别人一种有一团火球在燃烧的错觉。但是，这个【特技】只能在傍晚或者夜间使用，并且必须需要露出尾巴才可以用。直到[场景]结束为止，看到狐火的人可能会逃开，也可能出于好奇心而接近。如果看到的人的【涉世】属性比狐的【变化】属性要高的话，他们会出于自己的意志来选择接近或者远离。否则，他们必须要按照狐的意愿来行动。'},{name:'隐身蓑衣',cost:8,description:'让自己的身形变得透明。只有【野性】属性超过狐的【野性】属性3点的人能够注意到隐身中的狐。这个效果一直持续到狐自己解除，或者[场景]结束为止。'},{name:'偷天换日',cost:10,description:'把别的东西变成大小相近的别的东西，不管是生物还是非生物都可以。只要有作为参考的原型，从外表上无法区分变出来的东西和真正的本体。但是，就算把石头变成人类，它也无法移动；就算把故障的汽车变成新车，它也不能动起来。因为只是改变了物体的外表，它们的内在本质并没有发生变化。被改变外表的对象，会在狐解除效果后或者[场景]结束时变回原形。'},{name:'狐之婚礼',cost:12,description:'可以让某个地方下起小雨。就算没有云，开着太阳或挂着月亮也会下雨。在这场雨中的化形们，可以享受不需要消耗即可变化成人形的效果。另外，【奇迹点】和【心意点】也可以相互替换使用。（即【心意点】可以用于施展特技，【奇迹点】可以用来提高属性）这个效果一直持续到[场景]变化为止。'}],'狸':[{name:'点石成金',cost:2,description:'可以让落叶或者橡子看起来像钱一样。只能在傍晚或者夜间使用，并且天亮的时候这些钱就会变回原来的树叶或者橡子。'},{name:'化身妖怪',cost:8,description:'变成妖怪的姿态去吓唬人类。看到妖怪的人类或者化形会【吓一跳】。因为这个【特技】而被【吓一跳】的时候，狸的【变化】属性额外+1。要变成什么妖怪由你自己决定。'},{name:'千变万化',cost:8,description:'可以变成茶釜或者岩石这样的道具或者自然产物。另外，如果突然现出真身的话，说不定可以让对方【吓一跳】。如果使用2倍的点数消耗（也就是16点）的话，甚至可以变成汽车或者小房子这样可以容纳几个人的大小的东西。但是，这个【特技】不能让你变成液体、气体、火或者别的动植物。'},{name:'模仿专家',cost:10,description:'可以变成认识的人类或者化形的样子。不能变成不认识的人类。另外，在变身之后，每当和拥有变身对象的【牵绊】的角色对话时，每次说话都要用狸的【变化】属性和对方的【涉世】属性或者和变身对象的【牵绊】等级进行判定。如果判定失败，就会被认出是假冒的。'},{name:'狸之腹鼓',cost:12,description:'呼叫狸之同伴，大家一起奏响腹鼓。只能在傍晚或者夜晚使用，在听到腹鼓的[场景]中，所有登场的人的【涉世】属性全部会变成0，以及会变得无法使用电子产品或者别的文明产物。这个效果一直会持续到[场景]结束。'},{name:'如梦似幻',cost:16,description:'用幻觉替换周围的风景，完全欺骗对方的五感。让1个角色完全进入幻境，使其认为自己身处别处。当然除了你和该角色以外的别的角色不会受到影响，但是只要被欺骗的人的【变化】属性或者【涉世】属性不比狸的【变化】属性高的话，他就无法看破幻境。幻境一直持续到狸主动解除或者[场景]结束为止。'}],'猫':[{name:'路边野猫',cost:0,description:'猫咪随处可见，因此并不稀奇。如果以动物的状态被人类看到的话，并不会使其[吓一跳]，也不会被认为是可疑的对象。'},{name:'一团毛球',cost:4,description:'通过和别人嬉戏、跑到别人怀里撒娇来让别人敞开心扉。只要猫还在[场景]当中撒娇的话，目标的【涉世】属性就会变成0。'},{name:'心灵探查',cost:6,description:'可以洞察对方的心中的想法。但是，能读取到的只是对方心里想说的话，并不是对方的感情或者真相。就算如此，至少可以直接从对方的心中而不是嘴里探听他的真实想法。'},{name:'蹑手蹑脚',cost:8,description:'可以隐藏自己的声音和气息，不被他人发现地行动。[场景]中的任何角色都不会注意到猫的存在（不需要进行是否注意到的判定）只要使用者不发出明显的声音或者开口说话，效果会一直持续到[场景]结束。'},{name:'秘密路线',cost:10,description:'通过只有猫看得到的路线，可以从意想不到的地方离开或者进入[场景]。就算场景才进行到一半，也可以按照自己的喜好登场或者退场。即使你身处另一个[场景]当中，你依然可以使用该【特技】。只要对方不反抗你这么做，你也可以将这个【特技】作用于别人身上，但必须支付相应人数所需的【奇迹点】。'},{name:'猫合之众',cost:14,description:'可以呼唤小镇里的别的猫咪，让他们一起来帮助你。使用此特技的猫的【变化】和【野性】在[场景]结束之前会变成2倍。但是，因为会因此聚集大量的猫咪，《路边野猫》的【特技】就无法使用了。要是不能继续保持隐蔽的话，你和你的同伴们大概会让碰到你们的人们【吓一跳】。'}],'犬':[{name:'路边野狗',cost:0,description:'狗狗随处可见，因此并不稀奇。如果以动物的状态被人类看到的话，并不会使其[吓一跳]，也不会被认为是可疑的对象。'},{name:'亲密无间',cost:4,description:'你能通过和别人亲密接触来使他们冷静下来。可以在和别人[相遇]时获得【牵绊】后使用，也可以在正常的[场景]中使用。使亲近的对象得到等于你对他的【牵绊】等级的【心意点】点数。'},{name:'摇头摆尾',cost:6,description:'只要被摸了头，你就会感到很高兴。你可以让[场景]中的一个角色摸你的头，然后得到等于他对你的【牵绊】等级的【心意点】点数。在使用的时候，不要只说【使用】而是要真的在[场景]中让他抚摸你的头哦。'},{name:'百般抚慰',cost:6,description:'你可以通过舔舐对方的脸颊等行为让对方安慰下来。如果有同伴陷入了[吓一跳]的状态，或者在打架中输掉了的角色，不管他们陷入了怎样的负面情绪，你都可以让他们恢复原样。'},{name:'舍己为人',cost:8,description:'当有人要遭遇危险的时候，你可以让自己替代对方承受危险。如果使用的话，你可以在没有登场的[场景]中在你选择的时机登场，并让自己代替别人承受危险。如果危险的事情真的发生了的话，讲述者可以给与你一定的伤害，你也会得到来自对方的感谢。'},{name:'狂犬狂吠',cost:10,description:'你可以通过突然的吼叫来吓唬别的化形。使用这个【特技】时，如果你的【野性】属性比对方的【涉世】属性高的话，你可以让对方陷入[吓一跳]状态。因为这个【特技】被[吓一跳]的化形，和判定结果无关都会变回动物的真身。'}],'兔':[{name:'可爱迷人',cost:0,description:'兔子拥有能够迷倒所有人的可爱之处。拥有和兔子的【牵绊】的角色，在强化和兔子的【牵绊】时可以少花费1点【梦】。'},{name:'请用团子',cost:1,description:'做一些团子，然后将做好的团子分给大家享用。吃下这个团子的角色可以获得兔子做团子时所支付出【奇迹点】等量的【梦】。'},{name:'垂头丧气',cost:3,description:'耷拉着耳朵，表现出一副失落的样子时，周围的人们就会开始关心你。只能在判定失败时使用。使用之后，兔子可以获得等于同一个[场景]中的一名角色和兔子之间的【牵绊】等级的【心意点】点数。'},{name:'援助之手',cost:6,description:'你能偶然遇到别人。你可以让和你有【牵绊】的角色在[场景]中登场。但是，角色登场之后的行动取决于那个PC或者讲述者。'},{name:'假装糊涂',cost:8,description:'就算有所隐瞒，说一些谎话，对方也不会怀疑你。如果使用这个【特技】，你可以使一名角色不再怀疑你。就算有决定性的证据被第三者所找到，只要你不承认的话，对方就不会怀疑你。效果持续到[场景]结束为止。'},{name:'银月之光',cost:20,description:'借助月亮的力量，你可以将动物变成人类，也可以将人类变成动物。只能在有月亮的夜晚，在对方同意的情况下使用。变身并不能改变他们的性别，但是他们可以按照自己的意愿选择年龄和服装。变成人类的化形会失去【基本特技】（【弱点】和对应的【特技】不会失去）变成动物的人类会得到那个动物的【弱点】和【特技】。直到兔子主动解开法术或者故事结束为止，变身的效果都不会消失。'}],'鸟':[{name:'一只小鸟',cost:0,description:'鸟是随处可见的动物。就算你被人类看到了动物的形态，你也不会让他们[吓一跳]，或者被当做可疑的家伙。'},{name:'自由之翼',cost:2,description:'你拥有着可以在天空中自由飞翔的翅膀。你也可以带着比你小的东西一起飞起来。另外，当你在逃跑或者找东西的时候，你的能力值+2。但是，这个【特技】在你完全变成人类时无法使用。这个效果一直持续到[场景]改变为止。'},{name:'疾风之诗',cost:4,description:'可以随心所欲地刮起风来。当使用此【特技】时，你不仅可以让风以一种不自然的方式吹起来，还可以按照自己的意愿操控在空中的纸片等能被风吹动的物体。虽然也可以吹起一阵疾风，但是是无法制造出那种台风一样有破坏力的风的。'},{name:'授人以翼',cost:8,description:'你可以让人或者化形变得能够在天空中飞翔。只能对和你有【牵绊】的人类或者化形使用。在[场景]结束前，对方可以通过花费2点【奇迹点】或者【心意点】来使用鸟的基本特技《自由之翼》。'},{name:'流言蜚语',cost:10,description:'可以在小镇里扩散流言。但是，你不能扩散会伤害到某人或者与事实不符的流言。这个流言本身没有数值上的效果，但是根据内容不同应该可以起到帮助他人的作用（因此，你不能用这个【特技】去说别人的坏话）'},{name:'羽翼为枕',cost:12,description:'将你柔软的羽毛当做枕头，去亲近别人的心灵。使对方对你的【牵绊】等级+1。但是，此【特技】只限在有翅膀的状态下使用，且对于每个角色在每个故事中只能使用一次。'}],'鼠':[{name:'遁地有方',cost:4,description:'可以通过些微的细缝，自由地在各种各样的场所之间游走。当你被关起来，或者被限制活动的时候，你可以从那个[场景]当中消失。另外，你也可以进入本来无法进入的地方。你不能携带同伴一起移动。'},{name:'怂恿撺掇',cost:6,description:'可以让别人代替你来做事情。可以在各种判定的时机使用。你本身不需要参加判定，并且可以让同一个[场景]中的登场人物进行判定。判定时，你可以使用你或者对方的【心意点】点数来提高属性。'},{name:'吱吱不休',cost:8,description:'你善于用言辞欺骗别人。使用此【特技】，你可以让别人相信你说的谎言。只要你的【涉世】比对方的【涉世】要高，你就可以让对方相信你说的任何事情。只要对方没有直接看到明显的证据，他就不会对你说的话有所怀疑。'},{name:'偷偷摸摸',cost:8,description:'可以隐藏自己的声音和气息，不被他人发现地行动。[场景]中的任何角色都不会注意到鼠的存在（不需要进行是否注意到的判定）只要使用者不发出明显的声音或者开口说话，效果会一直持续到[场景]结束。'},{name:'鼠多势众',cost:8,description:'你有着庞大的家族，并能得到他们的帮助。使用后鼠的【涉世】属性直到[场景]结束前，变成原来的2倍。'},{name:'胡行乱闹',cost:12,description:'鼠的头脑非常聪明，用小小的恶作剧就能产生巨大的影响。当有角色（化形或者妖怪）要使用【特技】时，你可以使用此【特技】。使用的话，可以让1个即将生效的【特技】失去效果。'}]};
let token=localStorage.getItem('token');
let user=null,room=null,myCharId=null,myChar=null,members=[],isGM=false,ws=null,wsReconnectTimer=null,lastIncoming='',keyboardTarget=null,keyboardCallback=null,selectedCharId=null,upgradeBondId=null,upgradeTarget=0,outgoingBonds=[],incomingBonds=[],editingBondId=null,editingIncomingBondId=null,isEditingResource=false;

async function api(url,opts={}){opts.headers={...opts.headers,'Authorization':'Bearer '+(token||''),'Content-Type':'application/json'};const r=await fetch(url,opts);if(r.status===401){const j=await r.json().catch(()=>({}));token=null;localStorage.removeItem('token');showView('login');throw new Error(j.error||'登录已过期');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'请求失败');return j;}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');}
function toast(msg,type='success'){const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),3000);}
function showModal(id){document.getElementById('modal-overlay').classList.remove('hidden');document.getElementById(id).classList.remove('hidden');}
function hideModal(id){document.getElementById(id).classList.add('hidden');if(!document.querySelectorAll('.modal:not(.hidden)').length)document.getElementById('modal-overlay').classList.add('hidden');}
function closeAllModals(){document.querySelectorAll('.modal').forEach(e=>e.classList.add('hidden'));document.getElementById('modal-overlay').classList.add('hidden');}
function toggleAccordion(id){const el=document.getElementById(id);el.classList.toggle('collapsed');el.previousElementSibling.classList.toggle('collapsed');}
function switchTab(t){document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(t==='login'?0:1)===i));document.getElementById('login-panel').classList.toggle('hidden',t!=='login');document.getElementById('register-panel').classList.toggle('hidden',t!=='register');}

async function doLogin(){const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;if(!u||!p){toast('请输入用户名和密码','error');return;}try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});token=r.token;localStorage.setItem('token',token);user=r.user;showLobby();}catch(e){toast(e.message,'error');}}
async function doRegister(){const u=document.getElementById('reg-user').value.trim(),p=document.getElementById('reg-pass').value,n=document.getElementById('reg-name').value.trim();if(!u||!p){toast('请输入用户名和密码','error');return;}try{const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:u,password:p,displayName:n||u})});token=r.token;localStorage.setItem('token',token);user=r.user;showLobby();}catch(e){toast(e.message,'error');}}
function doLogout(){token=null;localStorage.removeItem('token');user=null;showView('login');}

async function showLobby(){try{user=await api('/api/auth/me');}catch(e){token=null;localStorage.removeItem('token');showView('login');return;}document.getElementById('lobby-user').textContent='欢迎，'+user.displayName;showView('lobby');const pendingRoom=localStorage.getItem('pendingRoom');if(pendingRoom){localStorage.removeItem('pendingRoom');await pickCharacterAndJoin(pendingRoom);}}

function showCreateRoom(){openKeyboard('输入房间代码',async(code)=>{if(!code)return;openKeyboard('输入房间名称（可选）',async(name)=>{try{await api('/api/rooms',{method:'POST',body:JSON.stringify({id:code,name:name||''})});toast('房间创建成功');await pickCharacterAndJoin(code);}catch(e){toast(e.message,'error');}});});}
function showJoinRoom(){openKeyboard('输入房间代码',async(code)=>{if(!code)return;await pickCharacterAndJoin(code);});}

async function pickCharacterAndJoin(roomCode){try{const chars=await api('/api/characters');if(!chars.length){toast('请先创建角色卡','error');return;}if(chars.length===1){await joinWithChar(roomCode,chars[0].id);return;}const list=document.getElementById('charselect-list');list.innerHTML='';chars.forEach(c=>{const b=document.createElement('button');b.className='btn btn-secondary target-btn';b.textContent=(c.name||'未命名')+' ('+(c.true_form||'')+')';b.onclick=async()=>{hideModal('charselect-modal');await joinWithChar(roomCode,c.id);};list.appendChild(b);});showModal('charselect-modal');}catch(e){toast(e.message,'error');}}
async function joinWithChar(roomCode,charId){try{await api('/api/rooms/'+encodeURIComponent(roomCode)+'/join',{method:'POST',body:JSON.stringify({characterId:charId})});selectedCharId=charId;await enterRoom(roomCode);}catch(e){toast(e.message,'error');}}

async function enterRoom(code){try{const r=await api('/api/rooms/'+encodeURIComponent(code));room=r;members=r.members||[];myCharId=members.find(m=>m.userId===user.id)?.characterId||selectedCharId;isGM=members.find(m=>m.characterId===myCharId)?.role==='gm'||r.gmUserId===user.id;if(myCharId){myChar=await api('/api/characters/'+myCharId);}document.getElementById('panel-gm').classList.toggle('hidden',!isGM);localStorage.setItem('currentRoom',room.id);localStorage.setItem('currentCharId',myCharId||'');showView('room');renderRoom();connectWS();}catch(e){toast(e.message,'error');}}

function renderRoom(){if(!room)return;document.getElementById('room-title').textContent=room.name||'未命名房间';document.getElementById('room-code').textContent=room.id;document.getElementById('room-phase').textContent=PHASE_MAP[room.phase]||room.phase;if(isGM){document.getElementById('my-char-info').style.display='none';document.getElementById('panel-outgoing').classList.add('hidden');document.getElementById('panel-incoming').classList.add('hidden');document.getElementById('panel-calc').classList.add('hidden');document.getElementById('btn-gm-leave').classList.remove('hidden');}else{document.getElementById('my-char-info').style.display='';document.getElementById('my-char-name').textContent=myChar?.name||'未知';document.getElementById('my-dream').textContent=myChar?.dream_points??0;document.getElementById('my-wonder').textContent=myChar?.wonder_points??0;document.getElementById('my-feeling').textContent=myChar?.feeling_points??0;document.getElementById('panel-outgoing').classList.remove('hidden');document.getElementById('panel-incoming').classList.remove('hidden');document.getElementById('panel-calc').classList.remove('hidden');document.getElementById('btn-gm-leave').classList.add('hidden');}const btnCalc=document.getElementById('btn-calculate');if(btnCalc){const isInter=room.phase==='intermission';btnCalc.disabled=!isInter;const hint=document.getElementById('calc-hint');if(hint)hint.textContent=isInter?'':'仅幕间可结算';}document.getElementById('panel-player-deduct').classList.toggle('hidden',isGM);renderMembers();renderOutgoing();renderSkillButtons();renderGM();}

function renderMembers(){if(isEditingResource)return;const c=document.getElementById('members-content');if(!members.length){c.innerHTML='<div class="empty">暂无成员</div>';return;}c.innerHTML=members.map(m=>{if(m.role==='gm'){return`<div class="member-row"><div><b>${esc(m.character?.name||'未知')}</b></div><span class="badge badge-gm">GM</span></div>`;}const isSelf=m.characterId===myCharId;const dp=m.character?.dreamPoints??0,fp=m.character?.feelingPoints??0,wp=m.character?.wonderPoints??0;let resHtml;if(isSelf){resHtml=`<span class="res-val res-editable res-dream" onclick="event.stopPropagation();editResource(this,'${m.characterId}','dream',${dp})">梦:${dp}</span><span class="res-val res-editable res-feeling" onclick="event.stopPropagation();editResource(this,'${m.characterId}','feeling',${fp})">心:${fp}</span><span class="res-val res-editable res-wonder" onclick="event.stopPropagation();editResource(this,'${m.characterId}','wonder',${wp})">奇:${wp}</span>`;}else{resHtml=`<span class="res-val res-dream">梦:${dp}</span><span class="res-val res-feeling">心:${fp}</span><span class="res-val res-wonder">奇:${wp}</span><button class="btn-give-dream" onclick="event.stopPropagation();quickGiveDream('${m.characterId}')">+梦</button>`;}return`<div class="member-row" onclick="showCharacterDetail('${m.characterId}')" style="cursor:pointer"><div><b>${esc(m.character?.name||'未知')}</b> <span style="color:#999">${esc(m.character?.trueForm||'')}</span></div><span class="resource-group">${resHtml}</span><span class="badge">玩家</span></div>`;}).join('');}

async function renderOutgoing(){if(!room||!myCharId)return;const c=document.getElementById('outgoing-list');if(!outgoingBonds.length){c.innerHTML='<div class="empty">暂无牵绊</div>';return;}let h='<table><thead><tr><th></th><th>目标</th><th>类型</th><th>等级</th><th>操作</th></tr></thead><tbody>';outgoingBonds.forEach((b,idx)=>{h+=`<tr draggable="true" data-bond-id="${b.id}" data-bond-idx="${idx}" data-list="outgoing"><td><span class="drag-handle" title="拖拽排序">⠿</span></td><td>${esc(b.toCharacterName)}</td><td><span class="bond-editable" onclick="editOutgoingBond('${b.id}')">${esc(b.bondType)}</span></td><td>${stars(b.bondLevel||1,5,true,b.id)}</td><td><button class="btn btn-secondary btn-sm" onclick="editOutgoingBond('${b.id}')" style="margin-right:4px">编辑</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteBond('${b.id}')">删除</button></td></tr>`;});h+='</tbody></table>';c.innerHTML=h;initDragSort(c.querySelector('tbody'),'outgoing');}

function renderIncoming(){if(!room||!myCharId)return;const bonds=incomingBonds;const c=document.getElementById('incoming-list');const snap=JSON.stringify(bonds.map(b=>({id:b.id,level:b.bondLevel})).sort((a,b)=>a.id.localeCompare(b.id)));if(lastIncoming!==''&&lastIncoming!==snap){document.getElementById('panel-incoming').classList.add('flash');setTimeout(()=>document.getElementById('panel-incoming').classList.remove('flash'),2000);}lastIncoming=snap;if(!bonds.length){c.innerHTML='<div class="empty">暂无牵绊</div>';return;}let h='<table><thead><tr><th></th><th>来源</th><th>类型</th><th>等级</th><th>操作</th></tr></thead><tbody>';bonds.forEach((b,idx)=>{const from=members.find(m=>m.characterId===b.fromCharacterId);const name=b.fromCharacterName||(from?from.character?.name:b.fromCharacterId)||'未知';const isSelfCreated=!b.fromCharacterId;if(isSelfCreated){h+=`<tr draggable="true" data-bond-id="${b.id}" data-bond-idx="${idx}" data-list="incoming"><td><span class="drag-handle" title="拖拽排序">⠿</span></td><td><span class="bond-editable" onclick="editIncomingBond('${b.id}')">${esc(name)}</span></td><td><span class="bond-editable" onclick="editIncomingBond('${b.id}')">${esc(b.bondType)}</span></td><td>${stars(b.bondLevel||1,5,false)}</td><td><button class="btn btn-secondary btn-sm" onclick="editIncomingBond('${b.id}')" style="margin-right:4px">编辑</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteBond('${b.id}')">删除</button></td></tr>`;}else{h+=`<tr draggable="true" data-bond-id="${b.id}" data-bond-idx="${idx}" data-list="incoming"><td><span class="drag-handle" title="拖拽排序">⠿</span></td><td>${esc(name)}</td><td>${esc(b.bondType)}</td><td>${stars(b.bondLevel||1,5,false)}</td><td><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteBond('${b.id}')">删除</button></td></tr>`;}});h+='</tbody></table>';c.innerHTML=h;initDragSort(c.querySelector('tbody'),'incoming');}

function renderGM(){if(!isGM||!room)return;const playerMembers=members.filter(m=>m.role!=='gm');const dt=document.getElementById('gm-dream-targets');dt.innerHTML='';playerMembers.forEach(m=>{const b=document.createElement('button');b.className='btn btn-secondary target-btn gm-dream-btn';b.textContent=(m.character?.name||'未知')+' ('+(m.character?.trueForm||'')+')';b.dataset.cid=m.characterId;b.onclick=()=>{document.querySelectorAll('.gm-dream-btn').forEach(x=>x.style.border='');b.style.border='3px solid var(--primary)';dt.dataset.selected=m.characterId;};dt.appendChild(b);});const wt=document.getElementById('gm-wonder-targets');wt.innerHTML='';playerMembers.forEach(m=>{const b=document.createElement('button');b.className='btn btn-secondary target-btn gm-wonder-btn';b.textContent=(m.character?.name||'未知')+' ('+(m.character?.trueForm||'')+')';b.dataset.cid=m.characterId;b.onclick=()=>{document.querySelectorAll('.gm-wonder-btn').forEach(x=>x.style.border='');b.style.border='3px solid var(--danger)';wt.dataset.selected=m.characterId;};wt.appendChild(b);});const ft=document.getElementById('gm-feeling-targets');ft.innerHTML='';playerMembers.forEach(m=>{const b=document.createElement('button');b.className='btn btn-secondary target-btn gm-feeling-btn';b.textContent=(m.character?.name||'未知')+' ('+(m.character?.trueForm||'')+')';b.dataset.cid=m.characterId;b.onclick=()=>{document.querySelectorAll('.gm-feeling-btn').forEach(x=>x.style.border='');b.style.border='3px solid var(--danger)';ft.dataset.selected=m.characterId;};ft.appendChild(b);});const rl=document.getElementById('gm-role-list');rl.innerHTML='';members.forEach(m=>{const d=document.createElement('div');d.className='member-row';d.innerHTML=`<span><b>${esc(m.character?.name||'未知')}</b></span><div><button class="btn btn-sm" onclick="doToggleRole('${m.characterId}','${m.role==='gm'?'player':'gm'}')">${m.role==='gm'?'设为玩家':'设为GM'}</button></div>`;rl.appendChild(d);});}

function stars(n,max,interactive,id){let h='<span class="stars">';for(let i=1;i<=max;i++){const f=i<=n?'★':'☆';const cl=interactive?'star-btn':'star';const oc=interactive?`onclick="event.stopPropagation();onStarClick('${id}',${i},${n})"`:'';h+=`<span class="${cl} ${i<=n?'active':''}" ${oc}>${f}</span>`;}return h+'</span>';}
function onStarClick(id,clicked,current){if(clicked<=current)return;upgradeBondId=id;upgradeTarget=clicked;const bond=outgoingBonds.find(b=>b.id===id);let toWeak=[];if(bond&&bond.toCharacterId){const targetMember=members.find(m=>m.characterId===bond.toCharacterId);if(targetMember&&targetMember.character){try{toWeak=JSON.parse(targetMember.character.weaknesses||'[]');}catch(e){}}}const cost=calcCost(current,clicked,toWeak,(myChar?.weaknesses)||[]);const rem=(myChar?.dream_points||0)-cost.total;let costDetail=`基础 ${cost.base} + 弱点加值 ${cost.modifier}`;if(cost.abilityDiscount)costDetail+=` + 特技减免 ${cost.abilityDiscount}`;document.getElementById('upgrade-info').innerHTML=`从 ${current} 级升级到 ${clicked} 级<br>消耗梦点: <b>${cost.total}</b> (${costDetail})<br>升级后剩余梦点: <b>${rem}</b>`;showModal('upgrade-modal');}
function calcCost(cur,tgt,toWeak,fromWeak){
  // 前端估算：真实梦点消耗由后端根据目标角色弱点计算
  let base=0;for(let i=cur+1;i<=tgt;i++)base+=LEVEL_COST[i]||0;
  let mod=0;for(const w of(toWeak||[])){const name=typeof w==='string'?w:(w&&w.name);if(typeof name==='string'&&(name.includes('装腔作势')||name.includes('囂俳')))mod+=2;}
  let disc=0;for(const w of(fromWeak||[])){const name=typeof w==='string'?w:(w&&w.name);if(typeof name==='string'&&(name.includes('寂寞难耐')||name.includes('寂しがり屋')))disc=-1;}
  return{base,modifier:mod,abilityDiscount:disc,total:Math.max(0,base+mod+disc)};
}
async function confirmUpgrade(){try{const r=await api('/api/bonds/upgrade',{method:'POST',body:JSON.stringify({bondId:upgradeBondId,targetLevel:upgradeTarget})});myChar.dream_points=r.remainingDreamPoints;document.getElementById('my-dream').textContent=r.remainingDreamPoints;hideModal('upgrade-modal');toast('升级成功！消耗 '+r.cost+' 梦点');}catch(e){toast(e.message,'error');}}
async function deleteBond(id){if(!confirm('确定删除此牵绊？'))return;try{await api('/api/bonds/'+id,{method:'DELETE'});toast('已删除');}catch(e){toast(e.message,'error');}}
function editOutgoingBond(id){const bond=outgoingBonds.find(b=>b.id===id);if(!bond)return;openBondModal(bond);}
function editIncomingBond(id){const bond=incomingBonds.find(b=>b.id===id);if(!bond)return;openIncomingBondModal(bond);}

function openBondModal(editData){editingBondId=editData?editData.id:null;const modalTitle=document.querySelector('#bond-modal h3');modalTitle.textContent=editData?'编辑牵绊':'添加牵绊';const tl=document.getElementById('bond-target-list');tl.innerHTML='';members.filter(m=>m.characterId!==myCharId&&m.role!=='gm').forEach(m=>{const b=document.createElement('button');b.className='btn btn-secondary';b.textContent=m.character?.name||'未知';const isMatch=editData&&m.character?.name===editData.toCharacterName;b.onclick=()=>{document.querySelectorAll('#bond-target-list .btn').forEach(x=>x.style.border='');b.style.border='4px solid var(--primary-dark)';tl.dataset.name=m.character?.name;tl.dataset.id=m.characterId;document.getElementById('bond-target-input').classList.add('hidden');};if(isMatch){b.style.border='4px solid var(--primary-dark)';tl.dataset.name=m.character?.name;tl.dataset.id=m.characterId;}tl.appendChild(b);});const tg=document.getElementById('bond-type-grid');tg.innerHTML='';BOND_TYPES.forEach(t=>{const b=document.createElement('button');b.className='btn';b.textContent=t.n;b.style.background=t.c;b.style.color='#fff';const isMatch=editData&&editData.bondType===t.n;b.onclick=()=>{document.querySelectorAll('#bond-type-grid .btn').forEach(x=>x.style.border='');b.style.border='4px solid var(--primary-dark)';tg.dataset.type=t.n;document.getElementById('bond-type-input').classList.add('hidden');};if(isMatch){b.style.border='4px solid var(--primary-dark)';tg.dataset.type=t.n;}tg.appendChild(b);});const cb=document.createElement('button');cb.className='btn';cb.textContent='自定义';cb.style.background='#888';cb.style.color='#fff';const isCustomType=editData&&!BOND_TYPES.find(t=>t.n===editData.bondType);cb.onclick=()=>{document.querySelectorAll('#bond-type-grid .btn').forEach(x=>x.style.border='');cb.style.border='4px solid var(--primary-dark)';delete tg.dataset.type;document.getElementById('bond-type-input').classList.remove('hidden');document.getElementById('bond-type-input').focus();};if(isCustomType){cb.style.border='4px solid var(--primary-dark)';delete tg.dataset.type;}tg.appendChild(cb);renderBondStars(editData?editData.bondLevel||1:1);const targetInput=document.getElementById('bond-target-input');const typeInput=document.getElementById('bond-type-input');if(editData){const hasTargetMember=members.find(m=>m.characterId!==myCharId&&m.role!=='gm'&&m.character?.name===editData.toCharacterName);if(hasTargetMember){targetInput.classList.add('hidden');}else{targetInput.classList.remove('hidden');targetInput.value=editData.toCharacterName;delete tl.dataset.name;delete tl.dataset.id;document.querySelectorAll('#bond-target-list .btn').forEach(x=>x.style.border='');}if(isCustomType){typeInput.classList.remove('hidden');typeInput.value=editData.bondType;}else{typeInput.classList.add('hidden');typeInput.value='';}}else{targetInput.value='';targetInput.classList.add('hidden');typeInput.value='';typeInput.classList.add('hidden');delete tl.dataset.name;delete tl.dataset.id;delete tg.dataset.type;}showModal('bond-modal');}
function toggleManualTarget(){document.getElementById('bond-target-input').classList.toggle('hidden');document.getElementById('bond-target-list').querySelectorAll('.btn').forEach(x=>x.style.border='');delete document.getElementById('bond-target-list').dataset.name;delete document.getElementById('bond-target-list').dataset.id;}
function renderBondStars(sel){const c=document.getElementById('bond-level-stars');c.innerHTML='';for(let i=1;i<=5;i++){const s=document.createElement('span');s.className='star-btn '+(i<=sel?'active':'');s.textContent=i<=sel?'★':'☆';s.onclick=()=>renderBondStars(i);c.appendChild(s);}c.dataset.level=sel;}
async function saveBond(){const tl=document.getElementById('bond-target-list');const tg=document.getElementById('bond-type-grid');const name=document.getElementById('bond-target-input').classList.contains('hidden')?(tl.dataset.name||''):document.getElementById('bond-target-input').value.trim();const type=document.getElementById('bond-type-input').classList.contains('hidden')?(tg.dataset.type||''):document.getElementById('bond-type-input').value.trim();const level=parseInt(document.getElementById('bond-level-stars').dataset.level||'1');if(!name){toast('请选择目标角色','error');return;}if(!type){toast('请选择牵绊类型','error');return;}try{const isEdit=!!editingBondId;if(isEdit){await api('/api/bonds/'+editingBondId,{method:'PUT',body:JSON.stringify({bondType:type,bondLevel:level,toCharacterName:name,toCharacterId:tl.dataset.id||null})});editingBondId=null;}else{await api('/api/bonds',{method:'POST',body:JSON.stringify({roomId:room.id,fromCharacterId:myCharId,toCharacterName:name,toCharacterId:tl.dataset.id||null,bondType:type,bondLevel:level})});}hideModal('bond-modal');toast(isEdit?'牵绊已更新':'牵绊已保存');}catch(e){toast(e.message,'error');}}

function openIncomingBondModal(editData){editingIncomingBondId=editData?editData.id:null;const modalTitle=document.querySelector('#incoming-bond-modal h3');modalTitle.textContent=editData?'编辑他人对我的牵绊':'添加他人对我的牵绊';const tg=document.getElementById('incoming-bond-type-grid');tg.innerHTML='';BOND_TYPES.forEach(t=>{const b=document.createElement('button');b.className='btn';b.textContent=t.n;b.style.background=t.c;b.style.color='#fff';const isMatch=editData&&editData.bondType===t.n;b.onclick=()=>{document.querySelectorAll('#incoming-bond-type-grid .btn').forEach(x=>x.style.border='');b.style.border='4px solid var(--primary-dark)';tg.dataset.type=t.n;document.getElementById('incoming-bond-type-input').classList.add('hidden');};if(isMatch){b.style.border='4px solid var(--primary-dark)';tg.dataset.type=t.n;}tg.appendChild(b);});const cb=document.createElement('button');cb.className='btn';cb.textContent='自定义';cb.style.background='#888';cb.style.color='#fff';const isCustomType=editData&&!BOND_TYPES.find(t=>t.n===editData.bondType);cb.onclick=()=>{document.querySelectorAll('#incoming-bond-type-grid .btn').forEach(x=>x.style.border='');cb.style.border='4px solid var(--primary-dark)';delete tg.dataset.type;document.getElementById('incoming-bond-type-input').classList.remove('hidden');document.getElementById('incoming-bond-type-input').focus();};if(isCustomType){cb.style.border='4px solid var(--primary-dark)';delete tg.dataset.type;}tg.appendChild(cb);renderIncomingBondStars(editData?editData.bondLevel||1:1);document.getElementById('incoming-source-input').value=editData?(editData.fromCharacterName||''):'';const typeInput=document.getElementById('incoming-bond-type-input');if(isCustomType){typeInput.classList.remove('hidden');typeInput.value=editData.bondType;}else{typeInput.value='';typeInput.classList.add('hidden');}if(!editData)delete tg.dataset.type;showModal('incoming-bond-modal');}
function renderIncomingBondStars(sel){const c=document.getElementById('incoming-bond-level-stars');c.innerHTML='';for(let i=1;i<=5;i++){const s=document.createElement('span');s.className='star-btn '+(i<=sel?'active':'');s.textContent=i<=sel?'★':'☆';s.onclick=()=>renderIncomingBondStars(i);c.appendChild(s);}c.dataset.level=sel;}
async function saveIncomingBond(){const tg=document.getElementById('incoming-bond-type-grid');const fromName=document.getElementById('incoming-source-input').value.trim();const type=document.getElementById('incoming-bond-type-input').classList.contains('hidden')?(tg.dataset.type||''):document.getElementById('incoming-bond-type-input').value.trim();const level=parseInt(document.getElementById('incoming-bond-level-stars').dataset.level||'1');if(!fromName){toast('请输入来源角色名','error');return;}if(!type){toast('请选择牵绊类型','error');return;}try{const isEdit=!!editingIncomingBondId;if(isEdit){await api('/api/bonds/'+editingIncomingBondId,{method:'PUT',body:JSON.stringify({bondType:type,bondLevel:level,fromCharacterName:fromName})});editingIncomingBondId=null;}else{await api('/api/bonds/incoming',{method:'POST',body:JSON.stringify({roomId:room.id,toCharacterId:myCharId,fromCharacterName:fromName,bondType:type,bondLevel:level})});}hideModal('incoming-bond-modal');toast(isEdit?'牵绊已更新':'牵绊已保存');}catch(e){toast(e.message,'error');}}

async function leaveRoom(){if(!room||!myCharId)return;if(!confirm('确定离开房间？'))return;try{await api('/api/rooms/'+encodeURIComponent(room.id)+'/leave',{method:'POST',body:JSON.stringify({characterId:myCharId})});disconnectWS();room=null;myCharId=null;myChar=null;members=[];localStorage.removeItem('currentRoom');localStorage.removeItem('currentCharId');showLobby();toast('已离开房间');}catch(e){toast(e.message,'error');connectWS();}}

function connectWS(){disconnectWS();if(!room||!myCharId)return;const wsUrl=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/rooms/'+encodeURIComponent(room.id)+'/ws?token='+encodeURIComponent(token)+'&characterId='+encodeURIComponent(myCharId);ws=new WebSocket(wsUrl);ws.onopen=()=>{if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null;}};ws.onmessage=(e)=>{try{const msg=JSON.parse(e.data);switch(msg.type){case 'room-update':room=msg.room;members=msg.members||[];const me=members.find(m=>m.characterId===myCharId);if(me&&me.character&&myChar){myChar.dream_points=me.character.dreamPoints??myChar.dream_points;myChar.wonder_points=me.character.wonderPoints??myChar.wonder_points;myChar.feeling_points=me.character.feelingPoints??myChar.feeling_points;isGM=me.role==='gm'||room.gmUserId===user.id;}renderMembers();renderGM();renderRoom();break;case 'bonds-update':outgoingBonds=msg.outgoing||[];incomingBonds=msg.incoming||[];renderOutgoing();renderIncoming();break;case 'action-result':if(msg.action==='give-dream'){toast('已发放梦点');}else if(msg.action==='deduct-wonder'||msg.action==='add-wonder'){toast(msg.action==='add-wonder'?'已增加奇迹点':'已消耗奇迹点');}else if(msg.action==='deduct-feeling'||msg.action==='add-feeling'){toast(msg.action==='add-feeling'?'已增加心意点':'已消耗心意点');}else if(msg.action==='set-phase'){toast('场景已更新');}else if(msg.action==='toggle-role'){toast('角色已调整');}else if(msg.action==='give-dream-player'){toast('已赠送梦点');}else if(msg.action==='update-resource'){toast('资源已更新');}break;case 'error':toast(msg.message,'error');break;}}catch(err){console.error('WS message parse error:',err);}};ws.onclose=()=>{ws=null;wsReconnectTimer=setTimeout(()=>{if(room&&myCharId)connectWS();},3000);};ws.onerror=()=>{ws=null;};}
function disconnectWS(){if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null;}if(ws){ws.onclose=null;ws.close();ws=null;}}

html+='<div style="margin-bottom:8px"><b style="color:var(--primary)">'+esc(ch.name||'未知')+' 对他人的牵绊</b></div>';if(charOutgoingBonds.length){html+='<table style="width:100%;border-collapse:collapse;margin-bottom:16px"><thead><tr><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">目标</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">类型</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">等级</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">强烈</th></tr></thead><tbody>';charOutgoingBonds.forEach(b=>{const bt=BOND_TYPES.find(t=>t.n===b.bondType);const color=bt?bt.c:'#666';html+='<tr><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+esc(b.toCharacterName||'未知')+'</td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0"><span style="color:'+color+';font-weight:600">'+esc(b.bondType)+'</span></td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+bondStarsHtml(b.bondLevel||1)+'</td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+(b.isIntense?'<span style="color:#E74C3C;font-weight:700">★</span>':'-')+'</td></tr>';});html+='</tbody></table>';}else{html+='<div style="color:#999;margin-bottom:16px;padding-left:8px">暂无</div>';}
// 他人对该角色的牵绊
html+='<div style="margin-bottom:8px"><b style="color:var(--primary)">他人对'+esc(ch.name||'未知')+'的牵绊</b></div>';if(charIncomingBonds.length){html+='<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><thead><tr><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">来源</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">类型</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">等级</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd">强烈</th></tr></thead><tbody>';charIncomingBonds.forEach(b=>{const bt=BOND_TYPES.find(t=>t.n===b.bondType);const color=bt?bt.c:'#666';const fromMember=members.find(m=>m.characterId===b.fromCharacterId);const fromName=b.fromCharacterName||(fromMember?fromMember.character?.name:'')||b.fromCharacterId||'未知';html+='<tr><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+esc(fromName)+'</td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0"><span style="color:'+color+';font-weight:600">'+esc(b.bondType)+'</span></td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+bondStarsHtml(b.bondLevel||1)+'</td><td style="padding:6px 8px;border-bottom:1px solid #f0f0f0">'+(b.isIntense?'<span style="color:#E74C3C;font-weight:700">★</span>':'-')+'</td></tr>';});html+='</tbody></table>';}else{html+='<div style="color:#999;padding-left:8px">暂无</div>';}
html+='</div>';
if(!isSelf){html+='<div id="give-dream-section" style="display:none;margin-top:16px;padding:12px;background:#fafafa;border-radius:8px">';html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span>赠送数量:</span><button class="btn btn-sm" onclick="adjustGiveDream(-1)">-</button><b id="give-dream-amount" style="font-size:22px;min-width:40px;text-align:center">1</b><button class="btn btn-sm" onclick="adjustGiveDream(1)">+</button></div>';html+='<div class="modal-actions" style="margin-top:0;justify-content:flex-start"><button class="btn btn-primary" onclick="doGiveDreamPlayer(\''+cid+'\')">确认</button><button class="btn" onclick="document.getElementById(\'give-dream-section\').style.display=\'none\';document.getElementById(\'give-dream-btn-wrap\').style.display=\'flex\'">取消</button></div>';html+='</div>';html+='<div class="modal-actions" id="give-dream-btn-wrap"><button class="btn btn-primary" onclick="document.getElementById(\'give-dream-section\').style.display=\'block\';this.parentElement.style.display=\'none\'">赠送梦点</button></div>';}document.getElementById('char-detail-name').textContent=ch.name||'未知';document.getElementById('char-detail-body').innerHTML=html;showModal('char-detail-modal');}
function bondStarsHtml(n){let h='<span class="stars">';for(let i=1;i<=5;i++){h+='<span class="star '+(i<=n?'active':'')+'">'+(i<=n?'★':'☆')+'</span>';}return h+'</span>';}
function adjustGiveDream(d){const el=document.getElementById('give-dream-amount');if(!el)return;let v=parseInt(el.textContent)+d;if(v<1)v=1;el.textContent=v;}
async function doGiveDreamPlayer(toCid){const amtEl=document.getElementById('give-dream-amount');if(!amtEl)return;const amt=parseInt(amtEl.textContent);wsSend({type:'give-dream-player',fromCharacterId:myCharId,toCharacterId:toCid,amount:amt});hideModal('char-detail-modal');toast('正在赠送 '+amt+' 梦点...');}

function editResource(el,cid,type,val){isEditingResource=true;const input=document.createElement('input');input.type='number';input.value=val;input.className='res-input';input.onclick=e=>e.stopPropagation();input.onblur=()=>{isEditingResource=false;saveResource(cid,type,parseInt(input.value)||0);};input.onkeydown=e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){isEditingResource=false;el.style.display='';input.remove();}};el.style.display='none';el.parentNode.insertBefore(input,el.nextSibling);input.focus();input.select();}
function saveResource(cid,type,newVal){wsSend({type:'update-resource',characterId:cid,resourceType:type,newValue:newVal});}
function quickGiveDream(targetCid){if(!room||!myCharId)return;wsSend({type:'give-dream-player',fromCharacterId:myCharId,toCharacterId:targetCid,amount:1});toast('正在赠送1点梦点...');}
let resourceLogsData=[];const rlFilters={type:'all',flow:'all',player:'all',time:'all'};
async function loadResourceLogs(){try{const data=await api('/api/rooms/'+encodeURIComponent(room.id)+'/resource-logs');resourceLogsData=data.logs||[];const names=[...new Set(resourceLogsData.map(l=>l.character_name))].sort();const sel=document.getElementById('resource-logs-player');sel.innerHTML='<option value="all">全部玩家</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});renderResourceLogs();}catch(e){}}
function filterResourceLogs(dim,val){rlFilters[dim]=val;if(dim==='type'||dim==='flow'){document.querySelectorAll(`#resource-logs-filter [data-filter-type="${dim}"]`).forEach(b=>{b.className='btn btn-sm'+(b.dataset.filter===val?' btn-primary':'');});}renderResourceLogs();}
function renderResourceLogs(){const RESOURCE_MAP={dream:'梦点',feeling:'心意点',wonder:'奇迹点'};let logs=[...resourceLogsData];if(rlFilters.type!=='all')logs=logs.filter(l=>l.resource_type===rlFilters.type);if(rlFilters.flow==='income')logs=logs.filter(l=>l.change_amount>0);else if(rlFilters.flow==='expense')logs=logs.filter(l=>l.change_amount<0);if(rlFilters.player!=='all')logs=logs.filter(l=>l.character_name===rlFilters.player);if(rlFilters.time!=='all'){const now=new Date();let cutoff;if(rlFilters.time==='today')cutoff=new Date(now.getFullYear(),now.getMonth(),now.getDate());else if(rlFilters.time==='7d')cutoff=new Date(now.getTime()-7*86400000);else if(rlFilters.time==='30d')cutoff=new Date(now.getTime()-30*86400000);logs=logs.filter(l=>new Date(l.created_at.replace(' ','T'))>=cutoff);}const html=logs.map(log=>{const sign=log.change_amount>0?'+':'';const color=log.change_amount>0?'#4caf50':'#f44336';const hasReason=log.reason&&log.reason!==('消耗'+(RESOURCE_MAP[log.resource_type]||log.resource_type))&&log.reason!==('增加'+(RESOURCE_MAP[log.resource_type]||log.resource_type));const reasonHtml=hasReason?`<span style="background:#fff3e0;color:#e65100;padding:1px 6px;border-radius:4px;font-size:12px;margin-left:4px">${esc(log.reason)}</span>`:'';return`<div style="padding:8px;border-bottom:1px solid #eee;font-size:14px"><b>${esc(log.character_name)}</b> <span style="color:${color};font-weight:600">${sign}${log.change_amount}</span> ${RESOURCE_MAP[log.resource_type]||log.resource_type}${reasonHtml}<span style="color:#aaa;float:right;font-size:12px">${log.created_at||''}</span></div>`;}).join('');document.getElementById('resource-logs-list').innerHTML=html||'<div style="padding:16px;color:#999">暂无记录</div>';}

function copyRoomLink(){if(!room)return;const url=new URL(location.href);url.searchParams.set('room',room.id);navigator.clipboard.writeText(url.toString()).then(()=>{toast('房间链接已复制到剪贴板');}).catch(()=>{const ta=document.createElement('textarea');ta.value=url.toString();document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('房间链接已复制到剪贴板');});}

async function refreshAllData(){if(!room)return;const btn=document.getElementById('btn-refresh');if(btn){btn.disabled=true;btn.textContent='刷新中...';}try{const r=await api('/api/rooms/'+encodeURIComponent(room.id));room=r;members=r.members||[];const me=members.find(m=>m.characterId===myCharId);if(me)isGM=me.role==='gm'||room.gmUserId===user.id;if(myCharId){myChar=await api('/api/characters/'+myCharId);}if(!isGM&&myCharId){try{outgoingBonds=await api('/api/bonds?room_id='+encodeURIComponent(room.id)+'&character_id='+encodeURIComponent(myCharId));}catch(e){outgoingBonds=[];}try{incomingBonds=await api('/api/bonds/incoming?room_id='+encodeURIComponent(room.id)+'&character_id='+encodeURIComponent(myCharId));}catch(e){incomingBonds=[];}}renderRoom();renderOutgoing();renderIncoming();toast('数据已刷新');}catch(e){toast('刷新失败: '+e.message,'error');}finally{if(btn){btn.disabled=false;btn.textContent='🔄 刷新';}}}

function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let dragSrcIdx=null,dragListType=null;
function initDragSort(tbody,listType){if(!tbody)return;const rows=tbody.querySelectorAll('tr[draggable]');rows.forEach(row=>{row.addEventListener('dragstart',e=>{dragSrcIdx=parseInt(row.dataset.bondIdx);dragListType=row.dataset.list;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.bondId);});row.addEventListener('dragend',()=>{row.classList.remove('dragging');tbody.querySelectorAll('tr').forEach(r=>{r.classList.remove('drag-over-top','drag-over-bottom');});});row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';if(row.dataset.list!==dragListType)return;const rect=row.getBoundingClientRect();const mid=rect.top+rect.height/2;row.classList.remove('drag-over-top','drag-over-bottom');if(e.clientY<mid){row.classList.add('drag-over-top');}else{row.classList.add('drag-over-bottom');}});row.addEventListener('dragleave',()=>{row.classList.remove('drag-over-top','drag-over-bottom');});row.addEventListener('drop',e=>{e.preventDefault();if(row.dataset.list!==dragListType)return;const targetIdx=parseInt(row.dataset.bondIdx);if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;const rect=row.getBoundingClientRect();const mid=rect.top+rect.height/2;const insertIdx=e.clientY<mid?targetIdx:targetIdx+1;const bonds=dragListType==='outgoing'?outgoingBonds:incomingBonds;const moved=bonds.splice(dragSrcIdx,1)[0];const adjustedInsert=insertIdx>dragSrcIdx?insertIdx-1:insertIdx;bonds.splice(adjustedInsert,0,moved);if(dragListType==='outgoing'){outgoingBonds=bonds;renderOutgoing();}else{incomingBonds=bonds;renderIncoming();}saveBondOrder(dragListType);});});}
async function saveBondOrder(listType){const bonds=listType==='outgoing'?outgoingBonds:incomingBonds;const bondIds=bonds.map(b=>b.id);try{await api('/api/bonds/reorder',{method:'PUT',body:JSON.stringify({bondIds})});}catch(e){toast('排序保存失败: '+e.message,'error');}}

async function init(){const urlParams=new URLSearchParams(location.search);const urlRoom=urlParams.get('room');if(urlParams.has('room')){const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('room');history.replaceState({},'',cleanUrl.toString());}if(token){try{user=await api('/api/auth/me');const savedRoom=localStorage.getItem('currentRoom');const savedCharId=localStorage.getItem('currentCharId');if(savedRoom&&savedCharId){try{await api('/api/rooms/'+encodeURIComponent(savedRoom)+'/join',{method:'POST',body:JSON.stringify({characterId:savedCharId})});selectedCharId=savedCharId;await enterRoom(savedRoom);return;}catch(e){localStorage.removeItem('currentRoom');localStorage.removeItem('currentCharId');}}if(urlRoom){await showLobby();await pickCharacterAndJoin(urlRoom);return;}showLobby();}catch(e){token=null;localStorage.removeItem('token');if(urlRoom){localStorage.setItem('pendingRoom',urlRoom);}showView('login');}}else{if(urlRoom){localStorage.setItem('pendingRoom',urlRoom);}showView('login');}}
init();
</script>
