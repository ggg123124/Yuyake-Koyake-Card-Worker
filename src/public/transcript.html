<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夕妖晚谣 · 实时对话记录</title>
<style>
  :root{--primary:#E67E22;--primary-dark:#D35400;--bg:#FFF8F0;--card:#fff;--text:#333;--danger:#c0392b;--ok:#27ae60;--muted:#999}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh}
  .wrap{max-width:1200px;margin:0 auto;padding:14px}
  .topbar{background:var(--primary);color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .topbar b{font-size:17px}
  .badge{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-size:13px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button{font:inherit;min-height:46px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;background:var(--primary);color:#fff;font-weight:600;transition:background .15s}
  button:hover{background:var(--primary-dark)}
  button.danger{background:var(--danger)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.live{background:var(--ok);animation:pulse 1.4s infinite}
  .dot.talk{background:#e74c3c}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .muted{color:var(--muted);font-size:13px}
  #log{max-height:58vh;overflow-y:auto;padding:4px 2px}
  .line{padding:7px 10px;border-radius:8px;margin-bottom:6px;background:#fafafa;display:flex;gap:10px;align-items:baseline}
  .line .t{color:var(--muted);font-size:12px;flex:0 0 62px;font-variant-numeric:tabular-nums}
  .line .who{font-weight:700;flex:0 0 auto;color:var(--primary-dark)}
  .line .txt{flex:1;word-break:break-word}
  .line.mine{background:#FFF3E6}
  .line.sys{background:#f0f7ff;color:#555}
  .grid2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:1024px){.grid2{grid-template-columns:2fr 1fr}}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .kv span:last-child{color:var(--muted)}
  .meter{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s linear}
  .vadcfg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;font-size:13px}
  .vadcfg label{display:flex;gap:6px;align-items:center;color:var(--muted)}
  .vadcfg input[type=range]{width:120px}
  .vadcfg select,.vadcfg input[type=number]{font:inherit;font-size:13px;padding:2px 4px;border:1px solid #ddd;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><b>🎙 实时对话记录</b> <span class="badge" id="room-code">-</span> <span class="badge" id="vad-badge">VAD 待机</span></div>
    <div class="muted" id="whoami">-</div>
  </div>

  <div id="msg" class="card" style="display:none"></div>

  <div class="grid2">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div><span class="dot" id="dot"></span><b id="state">未开始</b></div>
        <div class="row">
          <button id="btn-start">🎙 开始记录</button>
          <button id="btn-stop" class="danger" disabled>⏹ 停止</button>
        </div>
      </div>
      <div id="log"></div>
      <div class="muted" id="hint" style="margin-top:8px">
        按「说话停顿」自动切分上传：说完一句、静音约 0.7 秒，立刻转写并同步给房间里所有人。
      </div>
    </div>

    <div class="card">
      <b>运行状态</b>
      <div style="margin-top:10px">
        <div class="kv"><span>VAD 状态</span><span id="st-vad">待机</span></div>
        <div class="kv"><span>当前音量</span><span id="st-vol">0.000</span></div>
        <div class="kv"><span>已上传片段</span><span id="st-chunks">0</span></div>
        <div class="kv"><span>已转写句数</span><span id="st-segs">0</span></div>
        <div class="kv"><span>最近一次耗时</span><span id="st-ai">-</span></div>
        <div class="kv"><span>待上传队列</span><span id="st-queue">0</span></div>
        <div class="kv"><span>时钟偏移</span><span id="st-offset">-</span></div>
        <div class="kv"><span>连接状态</span><span id="st-ws">-</span></div>
      </div>
      <div class="meter"><i id="vol-bar"></i></div>

      <div class="vadcfg">
        <label>停顿切分 <input type="range" id="cfg-silence" min="300" max="1600" step="50" value="700"><span id="cfg-silence-v">700ms</span></label>
        <label>音量门限 <input type="range" id="cfg-gain" min="1.5" max="8" step="0.1" value="3.2"><span id="cfg-gain-v">3.2x</span></label>
      </div>
      <div class="muted" style="margin-top:6px">噪声底噪自适应：<span id="st-noise">-</span>（安静房间可不动；环境吵就把门限调高）</div>

      <div style="margin-top:12px" class="muted">
        词表（提升专名/黑话识别，GM 可在主站维护）：<br>
        <span id="prompt" style="font-size:12px"></span>
      </div>
    </div>
  </div>
</div>

<script>
const SR_FALLBACK = 16000;
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.search);
const roomCode = (params.get('room') || '').trim();
const token = localStorage.getItem('token') || '';

// ---- VAD 参数（20ms 帧） ----
const FRAME_MS = 20;
const VAD = {
  silenceMs: 700,        // 静音多久 = 一句结束
  minSpeechMs: 900,      // 短于此不算一句话（滤掉咳嗽/键盘）
  maxChunkMs: 25000,     // 单人长独白强制切分上限
  preRollMs: 320,        // 语音前保留，避免吞字头
  gain: 3.2,             // 门限 = 噪声底噪 × gain
  floorAbs: 0.004,       // 绝对下限，避免极安静时门限过低
  tailSilenceMs: 260,    // 切分时保留的句末静音（留太长会诱发模型幻觉）
};

let audioCtx = null, sourceNode = null, processorNode = null, mediaStream = null;
let sampleRate = SR_FALLBACK;
let noiseFloor = 0.006;

// VAD 运行态
let speaking = false;
let voicedSamples = 0;      // 当前句已累积的「有声」样本数
let silenceRun = 0;         // 连续静音样本数
let curFrames = [];         // 当前句的帧（Float32Array）
let preRoll = [];           // 语音前的滚动缓冲
let curStartSamples = 0;    // 当前句起点（相对录音开始的样本偏移）
let consumedSamples = 0;    // 已切走的总样本数

// 上传队列（顺序上传，避免序号乱序）
const queue = [];
let uploading = false;
let sessionId = null, chunkSeq = 0;
let ws = null, myCharId = '', myName = '';
let segCount = 0;

function showMsg(text, kind) {
  const el = $('msg');
  el.style.display = 'block';
  el.style.background = kind === 'error' ? '#fdecea' : '#eef7ee';
  el.innerHTML = text;
}
function setState(text, live) {
  $('state').textContent = text;
  $('dot').className = 'dot' + (live ? ' live' : '');
}
function line(t, who, text, sys) {
  const d = document.createElement('div');
  d.className = 'line' + (sys ? ' sys' : (who.endsWith('（我）') ? ' mine' : ''));
  d.innerHTML = `<span class="t">${t}</span><span class="who"></span><span class="txt"></span>`;
  d.querySelector('.who').textContent = who;
  d.querySelector('.txt').textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}
function hhmmss(ts) {
  const d = new Date(ts);
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
}
function sysLine(text) { line(hhmmss(Date.now()), '系统', text, true); }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  if (!res.ok) {
    let m = String(res.status);
    try { const j = await res.json(); m = j.error || m; } catch {}
    throw new Error(m);
  }
  return res.json();
}

// ---- WAV 编码（单声道 16bit，采样率跟随 AudioContext） ----
function encodeWav(float32, rate) {
  const buf = new ArrayBuffer(44 + float32.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + float32.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, float32.length * 2, true);
  let o = 44;
  for (let i = 0; i < float32.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function mergeFrames(frames) {
  const total = frames.reduce((a, b) => a + b.length, 0);
  const out = new Float32Array(total);
  let off = 0;
  for (const f of frames) { out.set(f, off); off += f.length; }
  return out;
}
function rmsOf(f) {
  let s = 0;
  for (let i = 0; i < f.length; i++) s += f[i] * f[i];
  return Math.sqrt(s / f.length);
}

// ---- 切出一句，压入上传队列 ----
function cutUtterance(reason) {
  const chunksArr = curFrames;
  const voiced = voicedSamples;
  const startSamples = curStartSamples;
  curFrames = [];
  speaking = false;
  voicedSamples = 0;
  silenceRun = 0;
  curStartSamples = consumedSamples;

  if (!chunksArr.length) return;
  const durMs = (voiced / sampleRate) * 1000;
  if (durMs < VAD.minSpeechMs) {
    // 太短，当噪声丢弃（留痕，别静默）
    console.debug(`[vad] 丢弃过短片段 ${Math.round(durMs)}ms（${reason}）`);
    return;
  }
  // 裁掉多余尾部静音：留一点句末感即可，过长静音会诱发 Whisper 幻觉（「请点赞订阅」那类）
  const tailKeep = Math.round((VAD.tailSilenceMs / 1000) * sampleRate);
  let keep = chunksArr.length;
  if (silenceRun > tailKeep) {
    let removed = 0;
    while (keep > 1 && removed < silenceRun - tailKeep) {
      removed += chunksArr[keep - 1].length;
      keep--;
    }
  }
  const pcm = mergeFrames(chunksArr.slice(0, keep));
  consumedSamples += pcm.length;
  queue.push({ pcm, startMs: Math.round((startSamples / sampleRate) * 1000), durMs: Math.round((pcm.length / sampleRate) * 1000), reason });
  $('st-queue').textContent = String(queue.length);
  pumpQueue();
}

// ---- 顺序上传 ----
async function pumpQueue() {
  if (uploading || !queue.length || !sessionId) return;
  uploading = true;
  const item = queue.shift();
  $('st-queue').textContent = String(queue.length);
  const seq = chunkSeq++;
  try {
    const res = await fetch(`/api/rooms/${encodeURIComponent(roomCode)}/transcript/chunk?sessionId=${encodeURIComponent(sessionId)}&chunkSeq=${seq}&startMs=${item.startMs}`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'audio/wav' },
      body: encodeWav(item.pcm, sampleRate),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    $('st-chunks').textContent = String(Number($('st-chunks').textContent) + 1);
    $('st-ai').textContent = (data.aiMs || 0) + 'ms';
    (data.segments || []).forEach((s) => {
      line(hhmmss(Date.now()), myName + '（我）', s.text, false);
      segCount++;
    });
    $('st-segs').textContent = String(segCount);
    console.debug(`[vad] 上传片段 seq=${seq} ${item.durMs}ms(${item.reason}) → 推理 ${data.aiMs}ms → ${(data.segments || []).length} 句`);
  } catch (e) {
    queue.unshift(item);           // 失败放回队首，下一轮重试（不丢数据）
    chunkSeq = seq;                // 序号回退，避免出现空洞
    sysLine('上传失败，稍后重试：' + e.message);
  } finally {
    uploading = false;
    $('st-queue').textContent = String(queue.length);
    if (queue.length) setTimeout(pumpQueue, 60);
  }
}

// ---- VAD 主循环：把每个回调缓冲切成 20ms 帧逐帧判定 ----
function processAudio(input, rate) {
  const frameLen = Math.round((FRAME_MS / 1000) * rate);
  const preRollFrames = Math.max(1, Math.round(VAD.preRollMs / FRAME_MS));
  const silenceSamples = Math.round((VAD.silenceMs / 1000) * rate);
  const maxChunkSamples = Math.round((VAD.maxChunkMs / 1000) * rate);

  for (let i = 0; i + frameLen <= input.length; i += frameLen) {
    const frame = input.slice(i, i + frameLen);
    const r = rmsOf(frame);
    const thr = Math.max(noiseFloor * VAD.gain, VAD.floorAbs);
    const isSpeech = r > thr;

    // 音量条（可视化）
    const vol = Math.min(1, r / (thr * 2.2));
    $('vol-bar').style.width = (vol * 100).toFixed(0) + '%';
    $('vol-bar').style.background = isSpeech ? '#e74c3c' : '#27ae60';
    $('st-vol').textContent = r.toFixed(4);

    if (isSpeech) {
      if (!speaking) {
        speaking = true;
        curFrames = preRoll.slice();     // 带上语音前的缓冲，避免吞字头
        const preSamples = curFrames.reduce((a, b) => a + b.length, 0);
        curStartSamples = Math.max(0, consumedSamples - preSamples);
        preRoll = [];
        voicedSamples = 0;
      }
      silenceRun = 0;
      voicedSamples += frame.length;
      curFrames.push(frame);
    } else {
      // 只在静音期更新噪声底噪
      noiseFloor = noiseFloor * 0.985 + r * 0.015;
      $('st-noise').textContent = noiseFloor.toFixed(4);
      if (speaking) {
        silenceRun += frame.length;
        curFrames.push(frame);           // 尾部静音也带上，让模型有句末感
        if (silenceRun >= silenceSamples) cutUtterance('停顿');
      } else {
        preRoll.push(frame);
        while (preRoll.length > preRollFrames) preRoll.shift();
      }
    }

    // 长独白强制切分
    if (speaking) {
      const acc = curFrames.reduce((a, b) => a + b.length, 0);
      if (acc >= maxChunkSamples) cutUtterance('超长');
    }
  }

  const talking = speaking;
  $('vad-badge').textContent = talking ? 'VAD 检测到语音' : 'VAD 静音中';
  $('st-vad').textContent = talking ? `说话中（已 ${Math.round((voicedSamples / rate) * 1000)}ms）` : '静音中';
  $('dot').className = 'dot' + (sessionId ? ' live' : '') + (talking ? ' talk' : '');
}

function connectWs() {
  if (!myCharId) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/api/rooms/${encodeURIComponent(roomCode)}/ws?token=${encodeURIComponent(token)}&characterId=${encodeURIComponent(myCharId)}`;
  ws = new WebSocket(url);
  ws.onopen = () => { $('st-ws').textContent = '已连接'; };
  ws.onclose = () => { $('st-ws').textContent = '已断开（3秒后重连）'; setTimeout(connectWs, 3000); };
  ws.onerror = () => { $('st-ws').textContent = '连接异常'; };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'transcript-update') {
      const who = m.speaker || '他人';
      (m.segments || []).forEach((s) => {
        if (who === myName) return;    // 自己的已本地显示，避免重复
        line(hhmmss(s.startMs || s.endMs || Date.now()), who, s.text, false);
      });
    }
  };
}

async function start() {
  $('msg').style.display = 'none';
  if (!roomCode) return showMsg('URL 里缺少 room 参数，请从房间页进入。', 'error');
  if (!token) return showMsg('未登录：请先回主站登录。', 'error');

  setState('准备中…', false);
  try {
    const me = await api('/api/auth/me');
    const room = await api('/api/rooms/' + encodeURIComponent(roomCode));
    const mine = (room.members || []).find((m) => m.userId === me.id);
    if (!mine) { setState('未开始', false); return showMsg('你不在这个房间里，无法开始记录。', 'error'); }
    myCharId = mine.characterId;
    myName = (mine.character && mine.character.name) || me.displayName || me.username;
    $('room-code').textContent = roomCode;
    $('whoami').textContent = `我：${myName}`;

    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    audioCtx = new AudioContext({ sampleRate: SR_FALLBACK });
    sampleRate = audioCtx.sampleRate;
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
    processorNode.onaudioprocess = (e) => {
      try { processAudio(new Float32Array(e.inputBuffer.getChannelData(0)), sampleRate); }
      catch (err) { console.error('[vad] 处理异常', err); }
    };
    sourceNode.connect(processorNode);
    processorNode.connect(audioCtx.destination);

    const sess = await api(`/api/rooms/${encodeURIComponent(roomCode)}/transcript/session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientTs: Date.now(), deviceLabel: (mediaStream.getAudioTracks()[0] || {}).label || '' }),
    });
    sessionId = sess.sessionId;
    consumedSamples = 0;
    $('st-offset').textContent = (sess.offsetMs >= 0 ? '+' : '') + sess.offsetMs + 'ms';
    $('prompt').textContent = sess.prompt || '(无)';

    connectWs();
    $('btn-start').disabled = true;
    $('btn-stop').disabled = false;
    setState('记录中（VAD 自动切分）', true);
    sysLine(`已开始记录 · 采样率 ${sampleRate}Hz · 停顿 ${VAD.silenceMs}ms 切分 · 模型 ${sess.model}`);
  } catch (e) {
    setState('未开始', false);
    showMsg('启动失败：' + e.message, 'error');
  }
}

async function stop() {
  setState('正在收尾…', false);
  // ① 先彻底停止采集：否则队列会边清边涨（VAD 还在往里塞新片）
  if (processorNode) { try { processorNode.disconnect(); } catch {} processorNode.onaudioprocess = null; }
  if (sourceNode) { try { sourceNode.disconnect(); } catch {} }
  if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
  if (audioCtx) { try { await audioCtx.close(); } catch {} }
  audioCtx = sourceNode = processorNode = mediaStream = null;

  try {
    if (speaking && curFrames.length) cutUtterance('停止');   // 把当前这句收尾
    const t0 = Date.now();
    while (queue.length || uploading) {
      $('st-queue').textContent = `${queue.length}${uploading ? '（上传中）' : ''}`;
      if (Date.now() - t0 > 90000) throw new Error('剩余片段上传超时，未全部入库');
      await new Promise((r) => setTimeout(r, 200));
    }
    $('st-queue').textContent = '0';
    if (sessionId) await api(`/api/rooms/${encodeURIComponent(roomCode)}/transcript/session/${encodeURIComponent(sessionId)}/stop`, { method: 'POST' });
  } catch (e) {
    sysLine('收尾时出错：' + e.message);
  } finally {
    if (ws) { try { ws.onclose = null; ws.close(); } catch {} ws = null; }
    $('btn-start').disabled = false;
    $('btn-stop').disabled = true;
    setState('已停止', false);
    $('st-ws').textContent = '已断开';
    $('st-vad').textContent = '待机';
    sysLine('已停止记录');
  }
}

// 运行时可调参数
$('cfg-silence').oninput = (e) => { VAD.silenceMs = Number(e.target.value); $('cfg-silence-v').textContent = e.target.value + 'ms'; };
$('cfg-gain').oninput = (e) => { VAD.gain = Number(e.target.value); $('cfg-gain-v').textContent = e.target.value + 'x'; };

// 加载历史（重进页面时回显）
(async () => {
  if (!roomCode || !token) return;
  try {
    const d = await api(`/api/rooms/${encodeURIComponent(roomCode)}/transcript`);
    (d.segments || []).forEach((s) => line(hhmmss(s.startMs), s.speaker, s.text, false));
    segCount = (d.segments || []).length;
    $('st-segs').textContent = String(segCount);
  } catch { /* 未加入房间等静默跳过 */ }
})();

$('room-code').textContent = roomCode || '(缺少 room 参数)';
